function todayKey() { return new Date().toISOString().slice(0, 10); }

function logEvent(userId, userName, eventType, payload) {
  if (SUPABASE_URL.startsWith('COLE_AQUI')) return; // ainda não configurado, ignora
  fetch(`${SUPABASE_URL}/rest/v1/events`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: JSON.stringify({ user_id: userId, user_name: userName, event_type: eventType, payload }),
  }).catch(() => {});
}

async function askDona(history, text, images) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch('/api/dona', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history, text, images }),
      signal: controller.signal,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'erro');
    return data.text;
  } finally {
    clearTimeout(timeoutId);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Extrai N quadros espalhados ao longo do vídeo, direto no navegador (nada é enviado como vídeo bruto).
function extractVideoFrames(file, frameCount = 5, maxWidth = 480) {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    // alguns navegadores (principalmente iPhone) só decodificam quadros de um vídeo
    // que está de fato no DOM — por isso anexamos fora da tela, em vez de display:none.
    video.style.position = 'fixed';
    video.style.top = '-9999px';
    video.style.width = '1px';
    video.style.height = '1px';
    document.body.appendChild(video);

    const url = URL.createObjectURL(file);
    video.src = url;

    const frames = [];
    let index = 0;
    let finished = false;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    const cleanup = () => {
      finished = true;
      clearTimeout(timeoutId);
      URL.revokeObjectURL(url);
      if (video.parentNode) video.parentNode.removeChild(video);
    };

    const timeoutId = setTimeout(() => {
      if (finished) return;
      cleanup();
      if (frames.length > 0) {
        resolve(frames); // aproveita o que já conseguiu capturar
      } else {
        reject(new Error('Tempo esgotado lendo o vídeo'));
      }
    }, 20000);

    const captureCurrent = () => {
      if (finished) return;
      try {
        const scale = Math.min(1, maxWidth / (video.videoWidth || maxWidth));
        canvas.width = (video.videoWidth || maxWidth) * scale;
        canvas.height = (video.videoHeight || maxWidth) * scale;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        frames.push(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
      } catch (e) {
        // se um quadro específico falhar, segue pros próximos em vez de travar tudo
      }
      index += 1;
      if (index < frameCount) {
        seekNext();
      } else {
        cleanup();
        resolve(frames);
      }
    };

    const seekNext = () => {
      const t = (video.duration * (index + 1)) / (frameCount + 1);
      video.currentTime = t;
    };

    video.onloadedmetadata = () => seekNext();
    video.onseeked = () => captureCurrent();
    video.onerror = () => { cleanup(); reject(new Error('Não consegui ler esse vídeo')); };
  });
}

function youtubeSearchUrl(name) {

}

// Fórmula de Mifflin-St Jeor (padrão usado por calculadoras de calorias) + fator de atividade (Harris-Benedict)
function computeCalorieBreakdown(profile) {
  const weight = parseFloat(profile.weight);
  const height = parseFloat(profile.height);
  const age = parseFloat(profile.age);
  if (!weight || !height || !age) return null;

  const bmr = profile.sex === 'M'
    ? 10 * weight + 6.25 * height - 5 * age + 5
    : 10 * weight + 6.25 * height - 5 * age - 161;

  const activity = ACTIVITY_FACTORS[profile.activityLevel] || ACTIVITY_FACTORS.leve;
  const tdee = bmr * activity.factor;

  const goal = GOAL_INFO[profile.goal] || GOAL_INFO.manter;
  const target = tdee * (1 + goal.adjustPct);

  return {
    bmr: Math.round(bmr),
    activityLabel: activity.label,
    tdee: Math.round(tdee),
    goalLabel: goal.label,
    adjustKcal: Math.round(tdee * goal.adjustPct),
    target: Math.round(target),
  };
}

// Referência clássica de hidratação: ~35ml de água por kg de peso corporal
function computeWaterGoalMl(weight) {
  const w = parseFloat(weight);
  if (!w) return 2000;
  return Math.round((w * 35) / 50) * 50; // arredonda pra múltiplo de 50ml
}

function Ring({ pct, size = 108 }) {
  const stroke = 9, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={size/2} cy={size/2} r={r} stroke={C.border} strokeWidth={stroke} fill="none" />
      <circle cx={size/2} cy={size/2} r={r} stroke={C.emerald} strokeWidth={stroke} fill="none"
        strokeDasharray={c} strokeDashoffset={c - c * Math.min(1, pct)} strokeLinecap="round" />
    </svg>
  );
}

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function Phone({ children }) {
  return (
    <div className="app-outer">
      <div className="phone-shell">
        {children}
      </div>
    </div>
  );
}

function App() {
  const [profile, setProfile] = useState(() => load('profile', null));
  const [form, setForm] = useState({ name: '', weight: '', height: '', age: '', sex: 'F', goal: 'emagrecer', activityLevel: 'leve' });
  const [tab, setTab] = useState('home');
  const [daily, setDaily] = useState(() => load(`daily:${todayKey()}`, { waterMl: 0, sleepHours: null }));
  const [containerMl, setContainerMl] = useState(() => load('container_ml', 200));
  const [streak, setStreak] = useState(0);
  const [messages, setMessages] = useState(() => load('chat_ui', [
    { id: 1, from: 'dona', text: 'Bom dia. Dormiu quanto essa noite? E manda uma foto do seu prato ou da geladeira quando quiser, eu leio.' },
  ]));
  const geminiHistoryRef = useRef(load('chat_api', []));
  const [busy, setBusy] = useState(false);
  const [busyLabel, setBusyLabel] = useState('DONA tá digitando...');
  const [input, setInput] = useState('');
  const [showBreakdown, setShowBreakdown] = useState(true);
  const [galleryGroup, setGalleryGroup] = useState('Todos');
  const [expandedExercise, setExpandedExercise] = useState(null);
  const scrollRef = useRef(null);
  const fileInputRef = useRef(null);
  const videoInputRef = useRef(null);
  const googleBtnRef = useRef(null);
  const [googleProfile, setGoogleProfile] = useState(null);
  const googleReady = !GOOGLE_CLIENT_ID.startsWith('COLE_AQUI');

  useEffect(() => {
    if (profile || !googleReady) return;
    let cancelled = false;
    const handleGoogleResponse = (resp) => {
      try {
        const payload = JSON.parse(atob(resp.credential.split('.')[1]));
        setGoogleProfile({ sub: payload.sub, name: payload.name, email: payload.email, picture: payload.picture });
        setForm((f) => ({ ...f, name: payload.name }));
      } catch (e) {}
    };
    const tryInit = () => {
      if (cancelled) return;
      if (window.google && window.google.accounts) {
        window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleResponse });
        if (googleBtnRef.current) {
          window.google.accounts.id.renderButton(googleBtnRef.current, { theme: 'filled_black', size: 'large', width: 300 });
        }
      } else {
        setTimeout(tryInit, 300);
      }
    };
    tryInit();
    return () => { cancelled = true; };
  }, [profile, googleProfile]);

  useEffect(() => {
    if (!profile) return;
    let s = load('streak', { count: 0, lastDate: null });
    const today = todayKey();
    if (s.lastDate !== today) {
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      s = { count: s.lastDate === yesterday ? s.count + 1 : 1, lastDate: today };
      save('streak', s);
    }
    setStreak(s.count);
  }, [profile]);

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy, tab]);

  const resetProfile = () => {
    if (!window.confirm('Apagar seu perfil e começar o cadastro de novo?')) return;
    ['profile', 'chat_ui', 'chat_api', 'streak', 'container_ml'].forEach(k => localStorage.removeItem(k));
    window.location.reload();
  };

  const completeOnboarding = () => {
    if (!form.name.trim()) return;
    const id = googleProfile ? googleProfile.sub : (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
    const p = {
      id, name: form.name.trim(), weight: form.weight, height: form.height, age: form.age, sex: form.sex,
      goal: form.goal, activityLevel: form.activityLevel,
      email: googleProfile ? googleProfile.email : undefined,
      picture: googleProfile ? googleProfile.picture : undefined,
    };
    save('profile', p);
    setProfile(p);
    logEvent(p.id, p.name, 'perfil_criado', { weight: p.weight, height: p.height, age: p.age, sex: p.sex, goal: p.goal, activityLevel: p.activityLevel, viaGoogle: !!googleProfile });
  };

  const updateDaily = (patch) => {
    const next = { ...daily, ...patch };
    setDaily(next);
    save(`daily:${todayKey()}`, next);
    if (patch.waterMl !== undefined) logEvent(profile.id, profile.name, 'agua_registrada', { waterMl: next.waterMl });
  };

  const setContainerSize = (ml) => {
    setContainerMl(ml);
    save('container_ml', ml);
  };

  const runDona = async (userMsgForUi, apiText, images) => {
    const nextMsgs = [...messages, userMsgForUi];
    setMessages(nextMsgs); save('chat_ui', nextMsgs);
    setBusy(true);
    try {
      const reply = await askDona(geminiHistoryRef.current, apiText, images);
      const imageParts = (images || []).map(img => ({ inline_data: { mime_type: img.mimeType, data: img.data } }));
      const userParts = [...imageParts, { text: apiText }];
      geminiHistoryRef.current = [...geminiHistoryRef.current, { role: 'user', parts: userParts }, { role: 'model', parts: [{ text: reply }] }];
      save('chat_api', geminiHistoryRef.current);
      const finalMsgs = [...nextMsgs, { id: Date.now() + 1, from: 'dona', text: reply }];
      setMessages(finalMsgs); save('chat_ui', finalMsgs);
      logEvent(profile.id, profile.name, images && images.length ? 'midia_analisada' : 'mensagem_enviada', {});
    } catch (e) {
      const finalMsgs = [...nextMsgs, { id: Date.now() + 1, from: 'dona', text: 'Não consegui te responder agora, tenta de novo em instantes.' }];
      setMessages(finalMsgs); save('chat_ui', finalMsgs);
    } finally { setBusy(false); setBusyLabel('DONA tá digitando...'); }
  };

  const send = () => {
    const text = input.trim();
    if (!text || busy) return;
    setInput('');
    runDona({ id: Date.now(), from: 'user', text }, text);
  };

  const quickAsk = (text) => {
    if (busy) return;
    setTab('chat');
    runDona({ id: Date.now(), from: 'user', text }, text);
  };

  const askCardapio = () => {
    const cal = computeCalorieBreakdown(profile);
    const goalLabel = cal ? cal.goalLabel.toLowerCase() : 'minha meta';
    quickAsk(`Me dá dicas de cardápio pra quem quer ${goalLabel}${cal ? `, considerando uma meta de ${cal.target} kcal por dia` : ''}.`);
  };

  const askTreino = () => {
    const cal = computeCalorieBreakdown(profile);
    const goalLabel = cal ? cal.goalLabel.toLowerCase() : 'meu objetivo';
    quickAsk(`Me dá dicas de treino pra quem quer ${goalLabel}. Que tipo de abordagem faz mais sentido?`);
  };

  const handlePhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || busy) return;
    const previewUrl = URL.createObjectURL(file);
    setBusyLabel('DONA tá analisando a foto...');
    const base64 = await fileToBase64(file);
    const caption = 'O que você vê nessa foto? Quantas calorias, mais ou menos, e tem algum ponto de atenção?';
    runDona({ id: Date.now(), from: 'user', text: caption, image: previewUrl }, caption, [{ data: base64, mimeType: file.type || 'image/jpeg' }]);
  };

  const handleVideo = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || busy) return;
    setBusyLabel('DONA tá analisando os quadros do vídeo...');
    setBusy(true);
    try {
      const frames = await extractVideoFrames(file, 5, 480);
      const previewUrl = 'data:image/jpeg;base64,' + frames[0];
      const caption = 'Analisa a execução desse exercício nesses quadros e me dá dicas de melhoria — sempre como sugestão, não como prescrição.';
      const images = frames.map(f => ({ data: f, mimeType: 'image/jpeg' }));
      setBusy(false);
      runDona({ id: Date.now(), from: 'user', text: caption, image: previewUrl }, caption, images);
    } catch (err) {
      setBusy(false);
      const finalMsgs = [...messages, { id: Date.now(), from: 'dona', text: 'Não consegui ler esse vídeo. Tenta um arquivo mais curto ou em outro formato (mp4 costuma funcionar melhor).' }];
      setMessages(finalMsgs); save('chat_ui', finalMsgs);
    }
  };

  if (!profile) {
    return (
      <Phone>
        <div style={{ overflowY: 'auto', padding: '32px 24px', flex: 1, minHeight: 0 }}>
          <p style={{ fontSize: 12, fontWeight: 700, letterSpacing: 2, color: C.emerald }}>PAPO RETO</p>
          <h1 style={{ fontSize: 24, fontWeight: 900, color: C.text, margin: '4px 0' }}>Chega de enrolação.</h1>
          <p style={{ fontSize: 12, color: C.dim, marginBottom: 24 }}>Cria seu perfil pra DONA começar a te acompanhar.</p>

          {googleReady && !googleProfile && (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, padding: '20px 0' }}>
              <div ref={googleBtnRef}></div>
              <p style={{ fontSize: 10, color: C.dim }}>Entre com o Google pra criar seu perfil</p>
            </div>
          )}

          {(!googleReady || googleProfile) && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {googleProfile && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 10 }}>
                <img src={googleProfile.picture} style={{ width: 32, height: 32, borderRadius: 16 }} />
                <div>
                  <p style={{ fontSize: 12, fontWeight: 700, color: C.text, margin: 0 }}>{googleProfile.name}</p>
                  <p style={{ fontSize: 10, color: C.dim, margin: 0 }}>{googleProfile.email}</p>
                </div>
              </div>
            )}
            {!googleProfile && (
              <input placeholder="Seu nome" value={form.name} onChange={e => setForm({...form, name: e.target.value})} style={inputStyle} />
            )}
            <div style={{ display: 'flex', gap: 12 }}>
              <input placeholder="Peso (kg)" value={form.weight} onChange={e => setForm({...form, weight: e.target.value})} style={inputStyle} />
              <input placeholder="Altura (cm)" value={form.height} onChange={e => setForm({...form, height: e.target.value})} style={inputStyle} />
            </div>
            <div style={{ display: 'flex', gap: 12 }}>
              <input placeholder="Idade" value={form.age} onChange={e => setForm({...form, age: e.target.value})} style={inputStyle} />
              <select value={form.sex} onChange={e => setForm({...form, sex: e.target.value})} style={inputStyle}>
                <option value="F">Feminino</option>
                <option value="M">Masculino</option>
              </select>
            </div>
            <select value={form.goal} onChange={e => setForm({...form, goal: e.target.value})} style={inputStyle}>
              <option value="emagrecer">Meu objetivo: queimar gordura</option>
              <option value="manter">Meu objetivo: manter o peso</option>
              <option value="ganhar">Meu objetivo: ganhar massa</option>
            </select>
            <select value={form.activityLevel} onChange={e => setForm({...form, activityLevel: e.target.value})} style={inputStyle}>
              <option value="sedentario">Atividade: sedentário</option>
              <option value="leve">Atividade: leve (1-3x/semana)</option>
              <option value="moderado">Atividade: moderado (3-5x/semana)</option>
              <option value="intenso">Atividade: intenso (6-7x/semana)</option>
            </select>
            <button onClick={completeOnboarding} style={{ background: C.emerald, color: '#022c1a', border: 'none', borderRadius: 12, padding: '14px', fontWeight: 700, fontSize: 14, marginTop: 8 }}>Começar</button>
          </div>
          )}
        </div>
      </Phone>
    );
  }

  return (
    <Phone>
      <div style={{ flex: 1, overflow: 'hidden' }}>
        {tab === 'home' && (
          <div style={{ height: '100%', overflowY: 'auto', padding: '0 20px 16px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '8px 0 20px' }}>
              <div>
                <p style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, color: C.emerald, margin: 0 }}>PAPO RETO</p>
                <h1 style={{ fontSize: 22, fontWeight: 900, color: C.text, margin: 0 }}>Bora, {profile.name.split(' ')[0]}.</h1>
              </div>
              <div style={{ textAlign: 'right' }}>
                <p style={{ fontSize: 22, fontWeight: 900, color: C.text, margin: 0 }}>{streak}</p>
                <p style={{ fontSize: 10, fontWeight: 600, color: C.dim, margin: 0 }}>dias seguidos</p>
                <button onClick={resetProfile} style={{ background: 'none', border: 'none', color: C.dim, fontSize: 9, marginTop: 6, padding: 0, textDecoration: 'underline' }}>trocar perfil</button>
              </div>
            </div>

            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16, marginBottom: 16, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', gap: 16 }}>
                <div>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>peso</p>
                  <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{profile.weight}kg</p>
                </div>
                <div>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>altura</p>
                  <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{profile.height}cm</p>
                </div>
                <div>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>idade</p>
                  <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{profile.age}</p>
                </div>
                <div>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>atividade</p>
                  <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{(ACTIVITY_FACTORS[profile.activityLevel] || ACTIVITY_FACTORS.leve).label.split(' ')[0]}</p>
                </div>
              </div>
              <button onClick={resetProfile} style={{ background: 'none', border: 'none', color: C.emerald, fontSize: 10, fontWeight: 700, padding: 0 }}>editar</button>
            </div>

            {(() => {
              const cal = computeCalorieBreakdown(profile);
              const waterGoalMl = computeWaterGoalMl(profile.weight);
              const waterMl = daily.waterMl || 0;
              const waterL = (waterMl / 1000).toFixed(1);
              const goalL = (waterGoalMl / 1000).toFixed(1);
              const waterPct = Math.min(1, waterMl / waterGoalMl);
              return (
                <React.Fragment>
                  <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 20, marginBottom: 16 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
                      <div style={{ position: 'relative', width: 108, height: 108 }}>
                        <Ring pct={cal ? 0.5 : 0} />
                        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                          <span style={{ fontSize: 18, fontWeight: 900, color: C.text }}>{cal ? cal.target : '—'}</span>
                          <span style={{ fontSize: 10, fontWeight: 600, color: C.dim }}>kcal meta</span>
                        </div>
                      </div>
                      <div style={{ flex: 1 }}>
                        <p style={{ fontSize: 14, fontWeight: 600, color: C.text, margin: 0 }}>{cal ? cal.goalLabel : 'Complete seu perfil'}</p>
                        <p style={{ fontSize: 12, color: C.dim, marginTop: 4 }}>Manda fotos das refeições, a DONA desconta da meta.</p>
                        {cal && (
                          <button onClick={() => setShowBreakdown(s => !s)} style={{ background: 'none', border: 'none', color: C.emerald, fontSize: 11, fontWeight: 700, padding: 0, marginTop: 6 }}>
                            {showBreakdown ? 'Esconder a conta ▲' : 'Ver a conta ▼'}
                          </button>
                        )}
                      </div>
                    </div>
                    {cal && showBreakdown && (
                      <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.border}`, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                        <div style={{ background: C.cardAlt, borderRadius: 8, padding: 8 }}>
                          <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>TMB (basal)</p>
                          <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{cal.bmr} kcal</p>
                        </div>
                        <div style={{ background: C.cardAlt, borderRadius: 8, padding: 8 }}>
                          <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>+ atividade ({cal.activityLabel.split(' ')[0]})</p>
                          <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{cal.tdee} kcal</p>
                        </div>
                        <div style={{ background: C.cardAlt, borderRadius: 8, padding: 8, gridColumn: '1 / -1' }}>
                          <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>Ajuste pro objetivo ({cal.goalLabel})</p>
                          <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{cal.adjustKcal >= 0 ? '+' : ''}{cal.adjustKcal} kcal → meta final {cal.target} kcal</p>
                        </div>
                      </div>
                    )}
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
                    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16 }}>
                      <p style={{ fontSize: 18, fontWeight: 900, color: C.text, margin: '8px 0 0' }}>{waterL}L / {goalL}L</p>
                      <p style={{ fontSize: 10, fontWeight: 600, color: C.dim, marginBottom: 6 }}>água hoje</p>
                      <div style={{ height: 4, borderRadius: 2, background: C.cardAlt, marginBottom: 8, overflow: 'hidden' }}>
                        <div style={{ height: '100%', width: `${waterPct * 100}%`, background: C.emerald }} />
                      </div>
                      <button onClick={() => updateDaily({ waterMl: waterMl + containerMl })} style={{ width: '100%', background: C.emeraldDim, color: C.text, border: 'none', borderRadius: 8, padding: '6px', fontSize: 11, fontWeight: 700, marginBottom: 6 }}>
                        + {containerMl}ml
                      </button>
                      <div style={{ display: 'flex', gap: 4 }}>
                        {[200, 500, 750].map(ml => (
                          <button key={ml} onClick={() => setContainerSize(ml)} style={{ flex: 1, background: containerMl === ml ? C.emerald : C.cardAlt, color: containerMl === ml ? '#022c1a' : C.dim, border: 'none', borderRadius: 6, padding: '4px', fontSize: 9, fontWeight: 700 }}>
                            {ml >= 1000 ? (ml/1000)+'L' : ml+'ml'}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16 }}>
                      <p style={{ fontSize: 18, fontWeight: 900, color: C.text, margin: '8px 0 0' }}>{daily.sleepHours ?? '—'}h</p>
                      <p style={{ fontSize: 10, fontWeight: 600, color: C.dim, marginBottom: 8 }}>sono essa noite</p>
                      <div style={{ display: 'flex', gap: 4 }}>
                        {[5,7,9].map(h => <button key={h} onClick={() => updateDaily({ sleepHours: h })} style={{ flex: 1, background: C.cardAlt, color: C.dim, border: 'none', borderRadius: 6, padding: '4px', fontSize: 10, fontWeight: 700 }}>{h}h</button>)}
                      </div>
                    </div>
                  </div>
                </React.Fragment>
              );
            })()}

            <button onClick={() => setTab('chat')} style={{ width: '100%', textAlign: 'left', background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16, display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: 18, background: C.emerald, color: '#022c1a', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900, flexShrink: 0 }}>D</div>
              <div style={{ minWidth: 0 }}>
                <p style={{ fontSize: 11, fontWeight: 700, color: C.dim, margin: 0 }}>DONA diz</p>
                <p style={{ fontSize: 13, color: C.text, margin: 0, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                  {messages.length ? messages[messages.length - 1].text : 'Toque pra conversar'}
                </p>
              </div>
            </button>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 12 }}>
              <button onClick={askCardapio} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 14, textAlign: 'left', opacity: busy ? 0.5 : 1 }}>
                <p style={{ fontSize: 18, margin: '0 0 6px' }}>🍽️</p>
                <p style={{ fontSize: 12, fontWeight: 700, color: C.text, margin: 0 }}>Dicas de cardápio</p>
              </button>
              <button onClick={askTreino} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 14, textAlign: 'left', opacity: busy ? 0.5 : 1 }}>
                <p style={{ fontSize: 18, margin: '0 0 6px' }}>🏋️</p>
                <p style={{ fontSize: 12, fontWeight: 700, color: C.text, margin: 0 }}>Dicas de treino</p>
              </button>
            </div>
          </div>
        )}

        {tab === 'chat' && (
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
            <div style={{ padding: '16px 20px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: `1px solid ${C.border}` }}>
              <div style={{ width: 36, height: 36, borderRadius: 18, background: C.emerald, color: '#022c1a', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900 }}>D</div>
              <div>
                <p style={{ fontSize: 14, fontWeight: 700, color: C.text, margin: 0 }}>DONA</p>
                <p style={{ fontSize: 10, color: C.dim, margin: 0 }}>mentora do Papo Reto</p>
              </div>
            </div>
            <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
              {messages.map(m => (
                <div key={m.id} style={{ display: 'flex', justifyContent: m.from === 'user' ? 'flex-end' : 'flex-start' }}>
                  <div style={{ maxWidth: '80%', background: m.from === 'user' ? C.emeraldDim : C.card, color: C.text, border: m.from === 'dona' ? `1px solid ${C.border}` : 'none', borderRadius: 16, padding: '10px 16px', fontSize: 14 }}>
                    {m.image && <img src={m.image} style={{ maxWidth: '100%', maxHeight: 160, borderRadius: 8, marginBottom: 8, objectFit: 'cover' }} />}
                    {m.text}
                  </div>
                </div>
              ))}
              {busy && <div style={{ fontSize: 11, color: C.dim }}>{busyLabel}</div>}
            </div>
            <div style={{ padding: 12, display: 'flex', gap: 8, borderTop: `1px solid ${C.border}` }}>
              <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={handlePhoto} />
              <input ref={videoInputRef} type="file" accept="video/*" style={{ display: 'none' }} onChange={handleVideo} />
              <button onClick={() => fileInputRef.current.click()} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 999, width: 40, height: 40 }}>📷</button>
              <button onClick={() => videoInputRef.current.click()} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 999, width: 40, height: 40 }}>🎥</button>
              <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Manda o papo..." disabled={busy} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 999, padding: '10px 16px', color: C.text, fontSize: 14 }} />
              <button onClick={send} disabled={busy} style={{ background: C.emerald, border: 'none', borderRadius: 999, width: 40, height: 40, opacity: busy ? 0.5 : 1 }}>➤</button>
            </div>
          </div>
        )}

        {tab === 'galeria' && (
          <div style={{ height: '100%', overflowY: 'auto', padding: '16px 20px' }}>
            <p style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, color: C.emerald, margin: 0 }}>GALERIA</p>
            <h1 style={{ fontSize: 20, fontWeight: 900, color: C.text, margin: '4px 0 12px' }}>Referência de execução</h1>
            <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 12, marginBottom: 4 }}>
              {['Todos', ...MUSCLE_GROUPS].map(g => (
                <button key={g} onClick={() => setGalleryGroup(g)} style={{ flexShrink: 0, background: galleryGroup === g ? C.emerald : C.card, color: galleryGroup === g ? '#022c1a' : C.dim, border: `1px solid ${galleryGroup === g ? C.emerald : C.border}`, borderRadius: 999, padding: '6px 14px', fontSize: 11, fontWeight: 700 }}>
                  {g}
                </button>
              ))}
            </div>
            {EXERCISES.filter(ex => galleryGroup === 'Todos' || ex.group === galleryGroup).map(ex => (
              <div key={ex.id} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
                <button onClick={() => setExpandedExercise(expandedExercise === ex.id ? null : ex.id)} style={{ width: '100%', textAlign: 'left', background: 'none', border: 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <p style={{ fontSize: 9, color: C.emerald, fontWeight: 700, margin: 0 }}>{ex.group.toUpperCase()}</p>
                    <p style={{ fontSize: 14, fontWeight: 700, color: C.text, margin: 0 }}>{ex.name}</p>
                  </div>
                  <span style={{ color: C.dim, fontSize: 12 }}>{expandedExercise === ex.id ? '▲' : '▼'}</span>
                </button>
                {expandedExercise === ex.id && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
                    <p style={{ fontSize: 10, fontWeight: 700, color: C.dim, margin: '0 0 6px' }}>DICAS DE EXECUÇÃO</p>
                    <ul style={{ margin: '0 0 10px', paddingLeft: 18 }}>
                      {ex.tips.map((t, i) => <li key={i} style={{ fontSize: 12, color: C.text, marginBottom: 4 }}>{t}</li>)}
                    </ul>
                    <div style={{ background: C.cardAlt, borderRadius: 8, padding: 10, marginBottom: 10 }}>
                      <p style={{ fontSize: 10, fontWeight: 700, color: C.amber, margin: '0 0 4px' }}>⚠ PONTO DE ATENÇÃO</p>
                      <p style={{ fontSize: 12, color: C.text, margin: 0 }}>{ex.attention}</p>
                    </div>
                    <a href={youtubeSearchUrl(ex.name)} target="_blank" rel="noopener noreferrer" style={{ display: 'block', textAlign: 'center', background: C.emeraldDim, color: C.text, borderRadius: 8, padding: '8px', fontSize: 12, fontWeight: 700, textDecoration: 'none' }}>
                      ▶ Ver execução no YouTube
                    </a>
                  </div>
                )}
              </div>
            ))}
            <p style={{ fontSize: 10, color: C.dim, textAlign: 'center', marginTop: 8 }}>
              Manda um vídeo do seu treino pra DONA no chat pra ela te dar dicas específicas.
            </p>
          </div>
        )}
      </div>

      <div style={{ display: 'flex', borderTop: `1px solid ${C.border}` }}>
        {[['home','Painel'], ['chat','DONA'], ['galeria','Galeria']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} style={{ flex: 1, background: 'none', border: 'none', padding: '12px 0', color: tab === id ? C.emerald : C.dim, fontSize: 10, fontWeight: 700 }}>{label}</button>
        ))}
      </div>
    </Phone>
  );
}

const inputStyle = { background: '#0F172A', border: '1px solid #1E293B', borderRadius: 12, padding: '12px 16px', color: '#F8FAFC', fontSize: 14, flex: 1, minWidth: 0, outline: 'none' };

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
<script>
  const src = document.getElementById('app-src').textContent;
  const output = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  const s = document.createElement('script');
  s.textContent = output;
  document.body.appendChild(s);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
