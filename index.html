function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

async function subscribeToPush(userId) {
  if (SUPABASE_ANON_KEY.startsWith('COLE_AQUI')) return { ok: false, reason: 'not_configured' };
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return { ok: false, reason: 'not_supported' };
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return { ok: false, reason: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }
  const subJson = sub.toJSON();
  await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Prefer': 'resolution=merge-duplicates',
    },
    body: JSON.stringify({ user_id: userId, endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth: subJson.keys.auth }),
  }).catch(() => {});
  return { ok: true };
}

const DONA_ENDPOINT = 'https://jpotuylypnjqblvwnrfn.supabase.co/functions/v1/dona-edge-function';

async function askDona(history, text, images, profileSummary) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch(DONA_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history, text, images, profileSummary }),
      signal: controller.signal,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'erro');
    return data.text;
  } finally {
    clearTimeout(timeoutId);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Reduz a foto antes de enviar. Foto de celular vem com 3-8MB e estoura o limite
// da requisição — 1280px de lado maior já é mais que suficiente pra IA reconhecer
// o prato, e derruba o tamanho pra algumas centenas de KB.
function fileToCompressedBase64(file, maxSide = 1280, quality = 0.72) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    const done = (result) => { URL.revokeObjectURL(url); resolve(result); };

    img.onload = () => {
      try {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const data = canvas.toDataURL('image/jpeg', quality).split(',')[1];
        console.log('[foto] original', (file.size / 1024 / 1024).toFixed(2) + 'MB',
                    '→ enviada', (data.length * 0.75 / 1024).toFixed(0) + 'KB');
        done({ data, mimeType: 'image/jpeg' });
      } catch (e) {
        // se o canvas falhar, manda o arquivo original mesmo
        fileToBase64(file).then(d => done({ data: d, mimeType: file.type || 'image/jpeg' }));
      }
    };
    img.onerror = () => {
      fileToBase64(file).then(d => done({ data: d, mimeType: file.type || 'image/jpeg' }));
    };
    img.src = url;
  });
}

// Extrai N quadros espalhados ao longo do vídeo, direto no navegador (nada é enviado como vídeo bruto).
function extractVideoFrames(file, frameCount = 5, maxWidth = 480) {
  console.log('[video] iniciando extração. arquivo:', file.name, file.type, (file.size / 1024 / 1024).toFixed(2) + 'MB');
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    // Fica dentro da área visível (não em -9999px) pra evitar que o iOS pause a
    // decodificação de vídeos que ele considera "fora de tela". Invisível por opacidade, não por posição.
    video.style.position = 'fixed';
    video.style.top = '0';
    video.style.left = '0';
    video.style.width = '2px';
    video.style.height = '2px';
    video.style.opacity = '0.01';
    video.style.pointerEvents = 'none';
    document.body.appendChild(video);

    const url = URL.createObjectURL(file);
    video.src = url;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const frames = [];
    let finished = false;
    let targets = [];
    let targetIdx = 0;

    const cleanup = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timeoutId);
      try { video.pause(); } catch (e) {}
      URL.revokeObjectURL(url);
      if (video.parentNode) video.parentNode.removeChild(video);
    };

    const timeoutId = setTimeout(() => {
      if (finished) return;
      cleanup();
      if (frames.length > 0) resolve(frames);
      else reject(new Error('Tempo esgotado lendo o vídeo'));
    }, 20000);

    const grabFrame = () => {
      try {
        const scale = Math.min(1, maxWidth / (video.videoWidth || maxWidth));
        canvas.width = Math.max(1, Math.round((video.videoWidth || maxWidth) * scale));
        canvas.height = Math.max(1, Math.round((video.videoHeight || maxWidth) * scale));
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        frames.push(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
        console.log('[video] quadro capturado', frames.length, 'de', frameCount);
      } catch (e) {
        console.error('[video] erro ao capturar quadro:', e.name, e.message);
      }
    };

    const finishUp = () => {
      console.log('[video] finalizado, total de quadros:', frames.length);
      cleanup();
      resolve(frames);
    };

    // Método principal: reproduz o vídeo de verdade (mudo) e captura quadros
    // conforme ele passa pelos tempos-alvo — é o jeito recomendado pra funcionar no iOS.
    const runByPlayback = () => {
      console.log('[video] usando requestVideoFrameCallback');
      const onFrame = (now, metadata) => {
        if (finished) return;
        const t = metadata.mediaTime;
        if (targetIdx < targets.length && t >= targets[targetIdx]) {
          grabFrame();
          targetIdx += 1;
        }
        if (targetIdx >= targets.length) { finishUp(); return; }
        video.requestVideoFrameCallback(onFrame);
      };
      video.requestVideoFrameCallback(onFrame);
      video.play().then(() => {
        console.log('[video] play() iniciou com sucesso');
      }).catch((e) => {
        console.error('[video] play() falhou:', e.name, e.message, '-> caindo pro método de busca');
        runBySeek();
      });
    };

    // Método reserva: pula ponto a ponto (usado se o navegador não suportar o método acima)
    const runBySeek = () => {
      console.log('[video] usando método de busca (seek)');
      let seekIndex = 0;
      const seekNext = () => { if (!finished) video.currentTime = targets[seekIndex]; };
      video.onseeked = () => {
        if (finished) return;
        grabFrame();
        seekIndex += 1;
        if (seekIndex < targets.length) seekNext();
        else finishUp();
      };
      seekNext();
    };

    video.onloadedmetadata = () => {
      console.log('[video] metadados carregados. duração:', video.duration, 'dimensões:', video.videoWidth, 'x', video.videoHeight, 'rVFC disponível:', typeof video.requestVideoFrameCallback === 'function');
      const dur = video.duration || 1;
      targets = Array.from({ length: frameCount }, (_, i) => (dur * (i + 1)) / (frameCount + 1));
      if (typeof video.requestVideoFrameCallback === 'function') runByPlayback();
      else runBySeek();
    };
    video.onerror = () => {
      console.error('[video] evento de erro do elemento <video>. código:', video.error && video.error.code, 'mensagem:', video.error && video.error.message);
      cleanup();
      reject(new Error('Não consegui ler esse vídeo'));
    };
  });
}

// Fórmula de Mifflin-St Jeor (padrão usado por calculadoras de calorias) + fator de atividade (Harris-Benedict)
function computeCalorieBreakdown(profile) {
  const weight = parseFloat(profile.weight);
  const height = parseFloat(profile.height);
  const age = parseFloat(profile.age);
  if (!weight || !height || !age) return null;

  const bmr = profile.sex === 'M'
    ? 10 * weight + 6.25 * height - 5 * age + 5
    : 10 * weight + 6.25 * height - 5 * age - 161;

  const activity = ACTIVITY_FACTORS[profile.activityLevel] || ACTIVITY_FACTORS.leve;
  const tdee = bmr * activity.factor;

  const goal = GOAL_INFO[profile.goal] || GOAL_INFO.manter;
  const target = tdee * (1 + goal.adjustPct);

  return {
    bmr: Math.round(bmr),
    activityLabel: activity.label,
    tdee: Math.round(tdee),
    goalLabel: goal.label,
    adjustKcal: Math.round(tdee * goal.adjustPct),
    target: Math.round(target),
  };
}

// Referência clássica de hidratação: ~35ml de água por kg de peso corporal
// Nomeia a refeição pelo horário, pro extrato ficar legível sem o usuário digitar nada
function mealLabelForNow(d = new Date()) {
  const h = d.getHours();
  if (h < 10) return 'Café da manhã';
  if (h < 12) return 'Lanche da manhã';
  if (h < 15) return 'Almoço';
  if (h < 18) return 'Lanche da tarde';
  if (h < 22) return 'Jantar';
  return 'Ceia';
}

function timeLabel(d = new Date()) {
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function computeWaterGoalMl(weight) {
  const w = parseFloat(weight);
  if (!w) return 2000;
  return Math.round((w * 35) / 50) * 50; // arredonda pra múltiplo de 50ml
}

// Valores de MET (Compêndio de Atividades Físicas, referência científica padrão)
const WORKOUT_TYPES = {
  caminhada: { label: 'Caminhada', met: 3.8 },
  corrida: { label: 'Corrida', met: 9 },
  musculacao: { label: 'Musculação', met: 5.5 },
  ciclismo: { label: 'Ciclismo', met: 7.5 },
  natacao: { label: 'Natação', met: 7 },
  hiit: { label: 'HIIT / Funcional', met: 8 },
  yoga: { label: 'Yoga / Pilates', met: 3 },
  danca: { label: 'Dança', met: 5 },
};

// kcal = MET × peso(kg) × tempo(h) — fórmula padrão usada por calculadoras de gasto calórico
function estimateWorkoutKcal(workoutType, minutes, weight) {
  const met = (WORKOUT_TYPES[workoutType] || WORKOUT_TYPES.musculacao).met;
  const w = parseFloat(weight) || 70;
  const hours = (parseFloat(minutes) || 0) / 60;
  return Math.round(met * w * hours);
}

// Renderiza **negrito** e listas (linhas começando com * ou -) de forma bonita, sem libs externas
function renderRichText(text) {
  const renderInline = (line, keyPrefix) => {
    const segments = line.split(/(\*\*[^*]+\*\*)/g).filter(Boolean);
    return segments.map((seg, i) => {
      if (seg.startsWith('**') && seg.endsWith('**')) {
        return <strong key={`${keyPrefix}-${i}`} style={{ color: C.emerald }}>{seg.slice(2, -2)}</strong>;
      }
      return <React.Fragment key={`${keyPrefix}-${i}`}>{seg}</React.Fragment>;
    });
  };

  const lines = text.split('\n');
  const blocks = [];
  let currentList = [];

  const flushList = () => {
    if (currentList.length) {
      blocks.push(
        <ul key={`ul-${blocks.length}`} style={{ margin: '4px 0', paddingLeft: 18 }}>
          {currentList.map((item, i) => <li key={i} style={{ marginBottom: 3 }}>{renderInline(item, `li-${blocks.length}-${i}`)}</li>)}
        </ul>
      );
      currentList = [];
    }
  };

  lines.forEach((line, idx) => {
    const trimmed = line.trim();
    if (/^[\*\-]\s+/.test(trimmed)) {
      currentList.push(trimmed.replace(/^[\*\-]\s+/, ''));
    } else {
      flushList();
      if (trimmed) blocks.push(<p key={`p-${idx}`} style={{ margin: '0 0 6px' }}>{renderInline(trimmed, `p-${idx}`)}</p>);
    }
  });
  flushList();
  return blocks;
}

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

                </p>
                <button onClick={() => setOnboardStep('form')} className="display"
                  style={{ width: '100%', background: C.emerald, color: C.onYellow, border: 'none', padding: '17px', fontSize: 17, letterSpacing: '.06em' }}>
                  Combinado. Bora.
                </button>
              </div>
            </div>
          )}

          {onboardStep === 'form' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <p className="mono-label" style={{ color: C.emerald, margin: 0 }}>Último passo</p>
            <h1 className="display" style={{ fontSize: 30, color: C.text, margin: '2px 0 12px', lineHeight: 1 }}>Seus números</h1>

            {googleProfile && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 11, border: `1px solid ${C.border}`, padding: 11, marginBottom: 4 }}>
                <img src={googleProfile.picture} style={{ width: 34, height: 34, borderRadius: 17 }} />
                <div style={{ minWidth: 0 }}>
                  <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{googleProfile.name}</p>
                  <p style={{ fontSize: 11, color: C.dim, margin: 0, overflow: 'hidden', textOverflow: 'ellipsis' }}>{googleProfile.email}</p>
                </div>
              </div>
            )}
            {!googleProfile && (
              <input placeholder="Seu nome" value={form.name} onChange={e => setForm({...form, name: e.target.value})} style={inputStyle} />
            )}
            <div style={{ display: 'flex', gap: 10 }}>
              <input placeholder="Peso (kg)" inputMode="numeric" value={form.weight} onChange={e => setForm({...form, weight: e.target.value})} style={inputStyle} />
              <input placeholder="Altura (cm)" inputMode="numeric" value={form.height} onChange={e => setForm({...form, height: e.target.value})} style={inputStyle} />
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <input placeholder="Idade" inputMode="numeric" value={form.age} onChange={e => setForm({...form, age: e.target.value})} style={inputStyle} />
              <select value={form.sex} onChange={e => setForm({...form, sex: e.target.value})} style={inputStyle}>
                <option value="F">Feminino</option>
                <option value="M">Masculino</option>
              </select>
            </div>
            <select value={form.goal} onChange={e => setForm({...form, goal: e.target.value})} style={inputStyle}>
              <option value="emagrecer">Meu objetivo: queimar gordura</option>
              <option value="manter">Meu objetivo: manter o peso</option>
              <option value="ganhar">Meu objetivo: ganhar massa</option>
            </select>
            <select value={form.activityLevel} onChange={e => setForm({...form, activityLevel: e.target.value})} style={inputStyle}>
              <option value="sedentario">Atividade: sedentário</option>
              <option value="leve">Atividade: leve (1-3x/semana)</option>
              <option value="moderado">Atividade: moderado (3-5x/semana)</option>
              <option value="intenso">Atividade: intenso (6-7x/semana)</option>
            </select>
            <select value={form.trains} onChange={e => setForm({...form, trains: e.target.value})} style={inputStyle}>
              <option value="sim">Costumo treinar, sim</option>
              <option value="nao">Não treino ainda</option>
            </select>
            {form.trains === 'sim' && (
              <React.Fragment>
                <select value={form.workoutType} onChange={e => setForm({...form, workoutType: e.target.value})} style={inputStyle}>
                  {Object.entries(WORKOUT_TYPES).map(([key, w]) => <option key={key} value={key}>Treino: {w.label}</option>)}
                </select>
                <div>
                  <p className="mono-label" style={{ color: C.dim, margin: '0 0 6px' }}>Horário que costuma treinar</p>
                  <input type="time" value={form.workoutTime} onChange={e => setForm({...form, workoutTime: e.target.value})} style={inputStyle} />
                </div>
              </React.Fragment>
            )}
            <button onClick={completeOnboarding} className="display"
              style={{ background: C.emerald, color: C.onYellow, border: 'none', padding: '17px', fontSize: 17, letterSpacing: '.06em', marginTop: 8 }}>
              Entendi. Vamos.
            </button>
          </div>
          )}
        </div>
      </Phone>
    );
  }

  return (
    <Phone>
      <div style={{ flex: 1, overflow: 'hidden' }}>
        {tab === 'home' && (() => {
          const cal = computeCalorieBreakdown(profile);
          const entries = daily.entries || [];
          const consumed = daily.caloriesConsumed || 0;
          const workoutBonus = daily.workoutKcal || 0;
          const workoutCountsForMeta = profile.goal !== 'emagrecer';
          const target = cal ? cal.target + (workoutCountsForMeta ? workoutBonus : 0) : 0;
          const left = target - consumed;
          const pct = target ? Math.min(1, consumed / target) : 0;
          const over = left < 0;
          const near = !over && pct >= 0.85;
          const barColor = over ? C.red : C.emerald;

          const waterGoalMl = computeWaterGoalMl(profile.weight);
          const waterMl = daily.waterMl || 0;
          const waterSegments = 12;
          const waterFilled = Math.round(Math.min(1, waterMl / waterGoalMl) * waterSegments);

          const dateStr = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
          const dateCap = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

          return (
          <div style={{ height: '100%', overflowY: 'auto', padding: '18px 20px 20px' }}>

            {/* Cabeçalho: data, saudação e sequência */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
              <div>
                <p className="display" style={{ fontSize: 21, color: C.text, margin: 0, lineHeight: 1 }}>{dateCap}</p>
                <p style={{ fontSize: 13, color: C.dim, margin: '6px 0 0' }}>Bom dia, {profile.name.split(' ')[0]}.</p>
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0, paddingLeft: 12 }}>
                <p className="display" style={{ fontSize: 24, color: C.emerald, margin: 0, lineHeight: 1 }}>{streak}</p>
                <p className="mono-label" style={{ color: C.dim, margin: '4px 0 0' }}>dias seguidos</p>
              </div>
            </div>

            {/* Card da DONA em destaque, bloco chapado amarelo */}
            <button onClick={() => setTab('chat')} style={{ width: '100%', textAlign: 'left', background: C.emerald, border: 'none', padding: '16px 18px 14px', marginBottom: 22, display: 'block' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                <span style={{ width: 16, height: 16, borderRadius: 8, border: `2px solid ${C.onYellow}`, display: 'inline-block', position: 'relative', flexShrink: 0 }}>
                  <span style={{ position: 'absolute', inset: 3, borderRadius: 4, background: C.onYellow }} />
                </span>
                <span className="mono-label" style={{ color: C.onYellow, fontWeight: 700 }}>DONA</span>
              </div>
              <p style={{ fontSize: 14.5, lineHeight: 1.45, color: C.onYellow, margin: 0, fontWeight: 500 }}>
                {messages.length && messages[messages.length - 1].from === 'dona'
                  ? messages[messages.length - 1].text.replace(/\*\*/g, '').slice(0, 130) + (messages[messages.length - 1].text.length > 130 ? '…' : '')
                  : 'Manda a foto do seu prato. Eu digo o que tem ali dentro.'}
              </p>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12, paddingTop: 10, borderTop: '1px solid rgba(11,11,11,.25)' }}>
                <span className="mono-label" style={{ color: C.onYellow, fontWeight: 700 }}>Responder pra DONA</span>
                <span style={{ color: C.onYellow, fontSize: 15 }}>→</span>
              </div>
            </button>

            {/* Saldo do dia */}
            <p className="mono-label" style={{ color: C.dim, margin: '0 0 8px' }}>Saldo do dia</p>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
              <span className="display" style={{ fontSize: 52, color: over ? C.red : C.text, lineHeight: .9 }}>
                {over ? '+' + Math.abs(left) : left}
              </span>
              <span style={{ fontSize: 13, color: C.dim }}>{over ? 'kcal acima da meta' : 'kcal restantes'}</span>
            </div>

            <div style={{ display: 'flex', height: 6, background: 'rgba(255,255,255,.10)', margin: '14px 0 10px' }}>
              <div style={{ width: `${pct * 100}%`, background: barColor }} />
            </div>

            <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}>
              <span className="mono-label" style={{ color: C.dim }}>Meta {cal ? cal.target.toLocaleString('pt-BR') : '—'}</span>
              <span className="mono-label" style={{ color: C.dim }}>Consumido {consumed.toLocaleString('pt-BR')}</span>
              {workoutBonus > 0 && (
                <span className="mono-label" style={{ color: C.emerald }}>Treino +{workoutBonus}</span>
              )}
            </div>
            <p style={{ fontSize: 12, color: C.dim, margin: '10px 0 0', lineHeight: 1.5 }}>
              {over
                ? 'Estourou hoje. Não some amanhã por causa disso — é assim que a maioria desiste.'
                : near
                  ? 'Tá perto do limite. As próximas escolhas decidem o dia.'
                  : workoutBonus > 0 && workoutCountsForMeta
                    ? 'Seu orçamento sobe quando você treina. Gastou, ganhou.'
                    : workoutBonus > 0
                      ? 'Treino registrado, mas o saldo não sobe: seu objetivo é déficit.'
                      : 'Registra o que comer que eu fecho a conta.'}
            </p>

            {/* Extrato do dia */}
            <p className="mono-label" style={{ color: C.dim, margin: '26px 0 4px' }}>Extrato de hoje</p>
            {entries.length === 0 ? (
              <p style={{ fontSize: 13, color: C.dim, margin: '10px 0 0', lineHeight: 1.5 }}>
                Nada lançado ainda. Manda a foto do que você comeu que eu lanço aqui.
              </p>
            ) : (
              <div>
                {entries.map(e => (
                  <div key={e.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '13px 0', borderBottom: `1px solid ${C.border}` }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                        <span style={{ fontSize: 14.5, color: C.text, fontWeight: 500 }}>{e.label}</span>
                        {e.source === 'foto' && (
                          <span className="mono-label" style={{ color: C.emerald, border: `1px solid ${C.emerald}`, padding: '2px 5px', fontSize: 8.5 }}>por foto</span>
                        )}
                      </div>
                      <span className="mono-label" style={{ color: C.dim, display: 'block', marginTop: 4 }}>
                        {e.time}{e.meta ? ` · ${e.meta}` : ''}
                      </span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
                      <span className="display" style={{ fontSize: 18, color: e.kcal > 0 ? C.emerald : C.text }}>
                        {e.kcal > 0 ? '+' : '−'}{Math.abs(e.kcal)}
                      </span>
                      <button onClick={() => removeLedgerEntry(e.id)} style={{ background: 'none', border: 'none', color: C.dim, fontSize: 16, padding: '0 2px', lineHeight: 1 }}>×</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Lançamento manual */}
            <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
              <input
                type="number"
                inputMode="numeric"
                placeholder="Lançar kcal na mão"
                value={mealKcalInput}
                onChange={e => setMealKcalInput(e.target.value)}
                style={{ ...inputStyle, padding: '11px 13px', fontSize: 13 }}
              />
              <button
                onClick={() => {
                  const add = parseInt(mealKcalInput) || 0;
                  if (add > 0) addLedgerEntry({ label: mealLabelForNow(), kcal: -add, source: 'manual' });
                  setMealKcalInput('');
                }}
                className="display"
                style={{ background: C.emerald, color: C.onYellow, border: 'none', padding: '11px 18px', fontSize: 14, flexShrink: 0 }}
              >
                Lançar
              </button>
            </div>

            {/* Água */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', margin: '28px 0 10px' }}>
              <p className="mono-label" style={{ color: C.dim, margin: 0 }}>Água</p>
              <p style={{ margin: 0, fontSize: 13, color: C.text }}>
                <span className="display" style={{ fontSize: 19, color: waterFilled >= waterSegments ? C.emerald : C.text }}>
                  {(waterMl / 1000).toFixed(1).replace('.', ',')}
                </span>
                <span style={{ color: C.dim }}> / {(waterGoalMl / 1000).toFixed(1).replace('.', ',')} L</span>
              </p>
            </div>
            <div style={{ display: 'flex', gap: 3, marginBottom: 12 }}>
              {Array.from({ length: waterSegments }).map((_, i) => (
                <div key={i} style={{ flex: 1, height: 6, background: i < waterFilled ? C.emerald : 'rgba(255,255,255,.13)' }} />
              ))}
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              {[[250, 'copo'], [500, 'garrafa']].map(([ml, nome]) => (
                <button key={ml} onClick={() => updateDaily({ waterMl: waterMl + ml })}
                  className="mono-label"
                  style={{ flex: 1, background: 'transparent', border: `1px solid ${C.border}`, color: C.text, padding: '12px 0', fontSize: 10 }}>
                  + {nome} {ml} ml
                </button>
              ))}
            </div>

            {/* Sono e treino */}
            <div style={{ display: 'flex', gap: 10, marginTop: 22 }}>
              <div style={{ flex: 1, border: `1px solid ${C.border}`, padding: '14px 14px 12px' }}>
                <p className="mono-label" style={{ color: C.dim, margin: 0 }}>Sono</p>
                <p className="display" style={{ fontSize: 26, color: C.text, margin: '9px 0 4px', lineHeight: 1 }}>
                  {daily.sleepHours ? `${daily.sleepHours}h` : '—'}
                </p>
                <p style={{ fontSize: 10.5, color: daily.sleepHours && daily.sleepHours < 7 ? C.emerald : C.dim, margin: '0 0 10px', lineHeight: 1.35 }}>
                  {daily.sleepHours
                    ? (daily.sleepHours < 7 ? 'Abaixo das 7h que você precisa' : 'Dentro do que o corpo pede')
                    : 'Registra pra DONA calibrar o dia'}
                </p>
                <div style={{ display: 'flex', gap: 4 }}>
                  <button onClick={() => updateDaily({ sleepHours: Math.max(0, (daily.sleepHours || 7) - 1) })}
                    style={{ flex: 1, background: 'transparent', border: `1px solid ${C.border}`, color: C.text, padding: '7px 0', fontSize: 14 }}>−</button>
                  <button onClick={() => updateDaily({ sleepHours: Math.min(14, (daily.sleepHours || 7) + 1) })}
                    style={{ flex: 1, background: 'transparent', border: `1px solid ${C.border}`, color: C.text, padding: '7px 0', fontSize: 14 }}>+</button>
                </div>
              </div>

              <div style={{ flex: 1, border: `1px solid ${C.border}`, padding: '14px 14px 12px', display: 'flex', flexDirection: 'column' }}>
                <p className="mono-label" style={{ color: C.dim, margin: 0 }}>Treino de hoje</p>
                {workoutBonus > 0 ? (
                  <React.Fragment>
                    <p className="display" style={{ fontSize: 19, color: C.text, margin: '9px 0 4px', lineHeight: 1.05 }}>
                      {(WORKOUT_TYPES[workoutTypeInput] || {}).label}
                      {daily.workoutMinutesLogged ? ` · ${daily.workoutMinutesLogged} min` : ''}
                    </p>
                    <p className="mono-label" style={{ color: C.emerald, margin: '0 0 10px' }}>~{workoutBonus} kcal queimadas</p>
                  </React.Fragment>
                ) : (
                  <p style={{ fontSize: 11, color: C.dim, margin: '9px 0 10px', lineHeight: 1.4 }}>
                    Zero minutos hoje. Vinte minutos ainda contam.
                  </p>
                )}
                <div style={{ marginTop: 'auto', display: 'flex', gap: 4 }}>
                  <select value={workoutTypeInput} onChange={e => setWorkoutTypeInput(e.target.value)}
                    style={{ ...inputStyle, padding: '7px 6px', fontSize: 11, borderRadius: 0 }}>
                    {Object.entries(WORKOUT_TYPES).map(([key, w]) => <option key={key} value={key}>{w.label}</option>)}
                  </select>
                  <input type="number" inputMode="numeric" placeholder="min" value={workoutMinutes}
                    onChange={e => setWorkoutMinutes(e.target.value)}
                    style={{ ...inputStyle, padding: '7px 6px', fontSize: 11, borderRadius: 0, flex: '0 0 46px' }} />
                </div>
                <button
                  onClick={() => {
                    const kcal = estimateWorkoutKcal(workoutTypeInput, workoutMinutes, profile.weight);
                    if (kcal > 0) {
                      addLedgerEntry({
                        label: (WORKOUT_TYPES[workoutTypeInput] || {}).label || 'Treino',
                        kcal, source: 'treino',
                        meta: workoutMinutes ? `${workoutMinutes} min` : null,
                      });
                      updateDaily({ workoutMinutesLogged: workoutMinutes });
                      setWorkoutMinutes('');
                    }
                  }}
                  className="mono-label"
                  style={{ background: C.emerald, color: C.onYellow, border: 'none', padding: '9px 0', marginTop: 4, fontSize: 10, fontWeight: 700 }}
                >
                  Registrar treino
                </button>
              </div>
            </div>

            {/* Perguntas prontas */}
            <div style={{ display: 'flex', gap: 10, marginTop: 22 }}>
              <button onClick={askCardapio} disabled={busy}
                style={{ flex: 1, border: `1px solid ${C.emerald}`, background: 'transparent', padding: '15px 14px', textAlign: 'left', opacity: busy ? .5 : 1 }}>
                <p className="display" style={{ fontSize: 17, color: C.emerald, margin: 0 }}>Dica de dieta</p>
                <p className="mono-label" style={{ color: C.dim, margin: '8px 0 0' }}>Pergunta pronta →</p>
              </button>
              <button onClick={askTreino} disabled={busy}
                style={{ flex: 1, border: `1px solid ${C.emerald}`, background: 'transparent', padding: '15px 14px', textAlign: 'left', opacity: busy ? .5 : 1 }}>
                <p className="display" style={{ fontSize: 17, color: C.emerald, margin: 0 }}>Dica de treino</p>
                <p className="mono-label" style={{ color: C.dim, margin: '8px 0 0' }}>Pergunta pronta →</p>
              </button>
            </div>
          </div>
          );
        })()}

        {tab === 'perfil' && (() => {
          const cal = computeCalorieBreakdown(profile);
          const act = (ACTIVITY_FACTORS[profile.activityLevel] || ACTIVITY_FACTORS.leve).label.split(' ')[0];
          return (
          <div style={{ height: '100%', overflowY: 'auto', padding: '18px 20px 20px' }}>
            <p className="mono-label" style={{ color: C.emerald, margin: 0 }}>Perfil</p>

            <div style={{ display: 'flex', alignItems: 'center', gap: 13, margin: '14px 0 22px' }}>
              {profile.picture && <img src={profile.picture} style={{ width: 46, height: 46, borderRadius: 23, flexShrink: 0 }} />}
              <div style={{ minWidth: 0 }}>
                <p className="display" style={{ fontSize: 22, color: C.text, margin: 0, lineHeight: 1.05 }}>{profile.name}</p>
                {profile.email && <p style={{ fontSize: 11.5, color: C.dim, margin: '4px 0 0', overflow: 'hidden', textOverflow: 'ellipsis' }}>{profile.email}</p>}
              </div>
            </div>

            {/* Objetivo em bloco chapado */}
            {cal && (
              <div style={{ background: C.emerald, color: C.onYellow, padding: '15px 17px', marginBottom: 20 }}>
                <p className="mono-label" style={{ margin: 0, fontWeight: 700 }}>Objetivo</p>
                <p className="display" style={{ fontSize: 24, margin: '7px 0 10px', lineHeight: 1 }}>{cal.goalLabel}</p>
                <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: '1px solid rgba(11,11,11,.25)', paddingTop: 10 }}>
                  <span className="mono-label" style={{ fontWeight: 700 }}>Meta diária</span>
                  <span className="mono-label" style={{ fontWeight: 700 }}>{cal.target.toLocaleString('pt-BR')} kcal</span>
                </div>
              </div>
            )}

            {/* Números */}
            <p className="mono-label" style={{ color: C.dim, margin: '0 0 2px' }}>Seus números</p>
            {[
              ['Peso', `${profile.weight} kg`],
              ['Altura', `${profile.height} cm`],
              ['Idade', `${profile.age} anos`],
              ['Atividade', act],
            ].map(([k, v]) => (
              <div key={k} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '13px 0', borderBottom: `1px solid ${C.border}` }}>
                <span style={{ fontSize: 14, color: C.dim }}>{k}</span>
                <span className="display" style={{ fontSize: 17, color: C.text }}>{v}</span>
              </div>
            ))}

            {/* Treino */}
            <p className="mono-label" style={{ color: C.dim, margin: '24px 0 2px' }}>Treino</p>
            <div style={{ padding: '13px 0', borderBottom: `1px solid ${C.border}` }}>
              {profile.trains ? (
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span className="display" style={{ fontSize: 17, color: C.text }}>{(WORKOUT_TYPES[profile.workoutType] || {}).label || profile.workoutType}</span>
                  {profile.workoutTime && <span className="mono-label" style={{ color: C.emerald }}>às {profile.workoutTime}</span>}
                </div>
              ) : (
                <span style={{ fontSize: 13.5, color: C.dim }}>Sem rotina de treino definida ainda.</span>
              )}
            </div>

            {/* Notificações */}
            <p className="mono-label" style={{ color: C.dim, margin: '24px 0 10px' }}>Notificações</p>
            {notifStatus !== 'ok' ? (
              <React.Fragment>
                <button onClick={handleActivateNotifications} disabled={notifStatus === 'asking'}
                  className="display"
                  style={{ width: '100%', background: C.emerald, color: C.onYellow, border: 'none', padding: '14px', fontSize: 15, letterSpacing: '.05em' }}>
                  {notifStatus === 'asking' ? 'Aguardando permissão...' : 'Ativar notificações'}
                </button>
                <p style={{ fontSize: 11.5, color: notifStatus === 'error' ? C.emerald : C.dim, margin: '10px 0 0', lineHeight: 1.5 }}>
                  {notifStatus === 'error'
                    ? 'Não deu pra ativar. Confere se você permitiu notificações no navegador.'
                    : 'Lembrete de água, de refeição e do seu horário de treino — mesmo com o app fechado.'}
                </p>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <p className="mono-label" style={{ color: C.emerald, margin: '0 0 12px' }}>✓ Ativadas</p>
                {[
                  ['Lembrete de água', notifWater, toggleNotifWater],
                  ['Lembrete de refeição', notifMeal, toggleNotifMeal],
                ].map(([label, val, fn]) => (
                  <div key={label} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0', borderBottom: `1px solid ${C.border}` }}>
                    <span style={{ fontSize: 14, color: C.text }}>{label}</span>
                    <button onClick={fn} className="mono-label"
                      style={{
                        background: val ? C.emerald : 'transparent',
                        color: val ? C.onYellow : C.dim,
                        border: `1px solid ${val ? C.emerald : C.border}`,
                        padding: '6px 12px', fontSize: 9.5, fontWeight: 700,
                      }}>
                      {val ? 'Ligado' : 'Desligado'}
                    </button>
                  </div>
                ))}
                {profile.trains && (
                  <p style={{ fontSize: 11.5, color: C.dim, margin: '12px 0 0', lineHeight: 1.5 }}>
                    O lembrete de treino segue o horário do seu perfil{profile.workoutTime ? ` (${profile.workoutTime})` : ''}.
                  </p>
                )}
              </React.Fragment>
            )}

            <button onClick={resetProfile} className="mono-label"
              style={{ width: '100%', background: 'transparent', border: `1px solid ${C.border}`, padding: '14px', color: C.dim, fontSize: 10, marginTop: 26 }}>
              Trocar perfil / sair
            </button>
          </div>
          );
        })()}

        {tab === 'chat' && (
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
            <div style={{ padding: '15px 20px', display: 'flex', alignItems: 'center', gap: 11, borderBottom: `1px solid ${C.border}`, flexShrink: 0 }}>
              <span style={{ width: 26, height: 26, borderRadius: 13, border: `2px solid ${C.emerald}`, display: 'inline-block', position: 'relative', flexShrink: 0 }}>
                <span style={{ position: 'absolute', inset: 5, borderRadius: 6, background: C.emerald }} />
              </span>
              <div>
                <p className="display" style={{ fontSize: 16, color: C.text, margin: 0, lineHeight: 1 }}>DONA</p>
                <p className="mono-label" style={{ color: C.dim, margin: '3px 0 0' }}>Papo reto, sem filtro</p>
              </div>
            </div>

            <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', padding: '16px 16px 20px', display: 'flex', flexDirection: 'column', gap: 14 }}>
              {messages.map(m => (
                <div key={m.id} style={{ display: 'flex', justifyContent: m.from === 'user' ? 'flex-end' : 'flex-start' }}>
                  {m.image ? (
                    <div style={{ maxWidth: '84%', border: `1px solid ${C.border}`, background: C.card }}>
                      <img src={m.image} style={{ display: 'block', width: '100%', maxHeight: 240, objectFit: 'cover' }} />
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '9px 12px', borderTop: `1px solid ${C.border}` }}>
                        <span className="mono-label" style={{ color: C.dim }}>{m.displayText || 'Foto enviada'}</span>
                        <span className="mono-label" style={{ color: C.emerald }}>{timeLabel(new Date(m.id))}</span>
                      </div>
                    </div>
                  ) : m.from === 'user' ? (
                    <div style={{ maxWidth: '84%', background: C.cardAlt, color: C.text, padding: '11px 15px', fontSize: 14.5, lineHeight: 1.5 }}>
                      {m.text}
                    </div>
                  ) : (
                    <div style={{ maxWidth: '92%', borderLeft: `3px solid ${C.emerald}`, paddingLeft: 13, color: C.text, fontSize: 14.5, lineHeight: 1.55 }}>
                      {renderRichText(m.text)}
                    </div>
                  )}
                </div>
              ))}
              {busy && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ width: 6, height: 6, background: C.emerald, display: 'inline-block' }} />
                  <span className="mono-label" style={{ color: C.dim }}>{busyLabel}</span>
                </div>
              )}
            </div>

            <div style={{ borderTop: `1px solid ${C.border}`, flexShrink: 0 }}>
              <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={handlePhoto} />
              <input ref={execPhotosRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={handleExecPhotos} />
              <input ref={videoInputRef} type="file" accept="video/*" style={{ display: 'none' }} onChange={handleVideo} />
              <div style={{ display: 'flex' }}>
                {[
                  ['Foto', () => fileInputRef.current.click()],
                  ['Várias fotos', () => execPhotosRef.current.click()],
                  ['Vídeo', () => videoInputRef.current.click()],
                ].map(([label, fn], i) => (
                  <button key={label} onClick={fn} disabled={busy}
                    className="display"
                    style={{
                      flex: 1, background: 'transparent', border: 'none',
                      borderRight: i < 2 ? `1px solid ${C.border}` : 'none',
                      borderBottom: `1px solid ${C.border}`,
                      color: C.emerald, padding: '12px 0', fontSize: 13, letterSpacing: '.06em',
                      opacity: busy ? .4 : 1,
                    }}>{label}</button>
                ))}
              </div>
              <div style={{ display: 'flex', padding: 12, gap: 10 }}>
                <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()}
                  placeholder="Fala aí, sem enrolar..." disabled={busy}
                  style={{ ...inputStyle, padding: '12px 14px' }} />
                <button onClick={send} disabled={busy} className="display"
                  style={{ background: C.emerald, color: C.onYellow, border: 'none', padding: '12px 20px', fontSize: 14, letterSpacing: '.06em', opacity: busy ? .5 : 1, flexShrink: 0 }}>
                  Enviar
                </button>
              </div>
            </div>
          </div>
        )}

        {tab === 'galeria' && (
          <div style={{ height: '100%', overflowY: 'auto', padding: '18px 20px 20px' }}>
            <p className="mono-label" style={{ color: C.emerald, margin: 0 }}>Exercícios</p>
            <h1 className="display" style={{ fontSize: 28, color: C.text, margin: '4px 0 16px', lineHeight: 1 }}>Referência de execução</h1>

            <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 14, marginBottom: 6 }}>
              {['Todos', ...MUSCLE_GROUPS].map(g => (
                <button key={g} onClick={() => setGalleryGroup(g)}
                  className="mono-label"
                  style={{
                    flexShrink: 0,
                    background: galleryGroup === g ? C.emerald : 'transparent',
                    color: galleryGroup === g ? C.onYellow : C.dim,
                    border: `1px solid ${galleryGroup === g ? C.emerald : C.border}`,
                    padding: '8px 13px', fontSize: 10,
                  }}>
                  {g}
                </button>
              ))}
            </div>

            {EXERCISES.filter(ex => galleryGroup === 'Todos' || ex.group === galleryGroup).map(ex => {
              const open = expandedExercise === ex.id;
              return (
                <div key={ex.id} style={{ borderTop: `1px solid ${C.border}` }}>
                  <button onClick={() => setExpandedExercise(open ? null : ex.id)}
                    style={{ width: '100%', textAlign: 'left', background: 'none', border: 'none', padding: '15px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12 }}>
                    <div style={{ minWidth: 0 }}>
                      <p className="mono-label" style={{ color: C.emerald, margin: 0 }}>{ex.group}</p>
                      <p className="display" style={{ fontSize: 17, color: C.text, margin: '6px 0 0', lineHeight: 1.1 }}>{ex.name}</p>
                    </div>
                    <span style={{ color: open ? C.emerald : C.dim, fontSize: 13, flexShrink: 0 }}>{open ? '—' : '+'}</span>
                  </button>

                  {open && (
                    <div style={{ paddingBottom: 18 }}>
                      <p className="mono-label" style={{ color: C.dim, margin: '0 0 10px' }}>Como executar</p>
                      {ex.tips.map((t, i) => (
                        <div key={i} style={{ display: 'flex', gap: 11, marginBottom: 8 }}>
                          <span className="mono-label" style={{ color: C.emerald, flexShrink: 0, paddingTop: 3 }}>0{i + 1}</span>
                          <span style={{ fontSize: 13.5, color: C.text, lineHeight: 1.5 }}>{t}</span>
                        </div>
                      ))}
                      <div style={{ background: C.emerald, color: C.onYellow, padding: '11px 13px', margin: '14px 0 12px' }}>
                        <p className="mono-label" style={{ margin: '0 0 5px', fontWeight: 700 }}>Erro mais comum</p>
                        <p style={{ fontSize: 13, margin: 0, lineHeight: 1.45, fontWeight: 500 }}>{ex.attention}</p>
                      </div>
                      <a href={youtubeSearchUrl(ex.name)} target="_blank" rel="noopener noreferrer"
                        className="mono-label"
                        style={{ display: 'block', textAlign: 'center', border: `1px solid ${C.border}`, color: C.text, padding: '11px', textDecoration: 'none' }}>
                        Ver execução no YouTube →
                      </a>
                    </div>
                  )}
                </div>
              );
            })}

            <p style={{ fontSize: 11.5, color: C.dim, marginTop: 22, lineHeight: 1.5, borderTop: `1px solid ${C.border}`, paddingTop: 16 }}>
              Vai treinar? Manda as fotos da sua execução pra DONA no chat que ela te dá dicas do seu movimento.
            </p>
          </div>
        )}
      </div>

      <div style={{ display: 'flex', borderTop: `1px solid ${C.border}`, background: C.bg, flexShrink: 0 }}>
        {[['home','Painel'], ['chat','DONA'], ['galeria','Exercícios'], ['perfil','Perfil']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            className="display"
            style={{
              flex: 1, background: 'none', border: 'none',
              borderTop: `3px solid ${tab === id ? C.emerald : 'transparent'}`,
              marginTop: -1, padding: '14px 0 13px',
              color: tab === id ? C.emerald : C.dim,
              fontSize: 12, letterSpacing: '.1em',
            }}>{label}</button>
        ))}
      </div>
    </Phone>
  );
}

const inputStyle = { background: '#151513', border: '1px solid rgba(255,255,255,.13)', borderRadius: 0, padding: '13px 14px', color: '#F5F4F0', fontSize: 14, flex: 1, minWidth: 0, outline: 'none' };

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
<script>
  const src = document.getElementById('app-src').textContent;
  const output = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  const s = document.createElement('script');
  s.textContent = output;
  document.body.appendChild(s);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/papo-reto/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
