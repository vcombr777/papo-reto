function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

async function subscribeToPush(userId) {
  if (SUPABASE_ANON_KEY.startsWith('COLE_AQUI')) return { ok: false, reason: 'not_configured' };
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return { ok: false, reason: 'not_supported' };
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return { ok: false, reason: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }
  const subJson = sub.toJSON();
  await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Prefer': 'resolution=merge-duplicates',
    },
    body: JSON.stringify({ user_id: userId, endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth: subJson.keys.auth }),
  }).catch((e) => console.error('[sync] falhou:', e.message));
  return { ok: true };
}

async function askDona(history, text, images, profileSummary) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch(DONA_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history, text, images, profileSummary }),
      signal: controller.signal,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'erro');
    return data.text;
  } finally {
    clearTimeout(timeoutId);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Reduz a foto antes de enviar. Foto de celular vem com 3-8MB e estoura o limite
// da requisição — 1280px de lado maior já é mais que suficiente pra IA reconhecer
// o prato, e derruba o tamanho pra algumas centenas de KB.

// ── Áudio ───────────────────────────────────────────────────────────────────
// Cada navegador grava num formato diferente (o iPhone usa mp4/aac, o Android webm).
// Em vez de torcer pra IA aceitar todos, convertemos aqui pra WAV 16kHz mono —
// formato universal pra voz, pequeno, e que funciona igual em qualquer aparelho.

function pickRecorderMime() {
  if (typeof MediaRecorder === 'undefined') return null;
  const candidatos = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac', 'audio/ogg'];
  for (const m of candidatos) {
    try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {}
  }
  return '';
}

function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const wr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  wr(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  wr(8, 'WAVE'); wr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);          // PCM
  view.setUint16(22, 1, true);          // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  wr(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buffer;
}

async function blobToWavBase64(blob, targetRate = 16000) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const arr = await blob.arrayBuffer();
  const decoded = await new Promise((res, rej) => {
    const p = ctx.decodeAudioData(arr, res, rej);
    if (p && p.then) p.then(res).catch(rej); // Safari usa a versão com callback
  });

  // junta os canais em mono
  const canais = decoded.numberOfChannels;
  const len = decoded.length;
  const mono = new Float32Array(len);
  for (let ch = 0; ch < canais; ch++) {
    const dados = decoded.getChannelData(ch);
    for (let i = 0; i < len; i++) mono[i] += dados[i] / canais;
  }

  // reamostra pra 16kHz por interpolação (funciona em qualquer navegador)
  const ratio = decoded.sampleRate / targetRate;
  const outLen = Math.floor(len / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos = i * ratio;
    const i0 = Math.floor(pos);
    const i1 = Math.min(len - 1, i0 + 1);
    const f = pos - i0;
    out[i] = mono[i0] * (1 - f) + mono[i1] * f;
  }

  try { ctx.close(); } catch (e) {}

  const wav = encodeWav(out, targetRate);
  let bin = '';
  const bytes = new Uint8Array(wav);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  console.log('[audio] enviado', (wav.byteLength / 1024).toFixed(0) + 'KB');
  return { data: btoa(bin), mimeType: 'audio/wav' };
}

function fileToCompressedBase64(file, maxSide = 1280, quality = 0.72) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    const done = (result) => { URL.revokeObjectURL(url); resolve(result); };

    img.onload = () => {
      try {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const data = canvas.toDataURL('image/jpeg', quality).split(',')[1];
        console.log('[foto] original', (file.size / 1024 / 1024).toFixed(2) + 'MB',
                    '→ enviada', (data.length * 0.75 / 1024).toFixed(0) + 'KB');
        done({ data, mimeType: 'image/jpeg' });
      } catch (e) {
        // se o canvas falhar, manda o arquivo original mesmo
        fileToBase64(file).then(d => done({ data: d, mimeType: file.type || 'image/jpeg' }));
      }
    };
    img.onerror = () => {
      fileToBase64(file).then(d => done({ data: d, mimeType: file.type || 'image/jpeg' }));
    };
    img.src = url;
  });
}

// Fórmula de Mifflin-St Jeor (padrão usado por calculadoras de calorias) + fator de atividade (Harris-Benedict)
function computeCalorieBreakdown(profile) {
  const weight = parseFloat(profile.weight);
  const height = parseFloat(profile.height);
  const age = parseFloat(profile.age);
  if (!weight || !height || !age) return null;

  const bmr = profile.sex === 'M'
    ? 10 * weight + 6.25 * height - 5 * age + 5
    : 10 * weight + 6.25 * height - 5 * age - 161;

  const activity = ACTIVITY_FACTORS[profile.activityLevel] || ACTIVITY_FACTORS.leve;
  const tdee = bmr * activity.factor;

  const goal = GOAL_INFO[profile.goal] || GOAL_INFO.manter;
  const target = tdee * (1 + goal.adjustPct);

  return {
    bmr: Math.round(bmr),
    activityLabel: activity.label,
    tdee: Math.round(tdee),
    goalLabel: goal.label,
    adjustKcal: Math.round(tdee * goal.adjustPct),
    target: Math.round(target),
  };
}

// Referência clássica de hidratação: ~35ml de água por kg de peso corporal
// Nomeia a refeição pelo horário, pro extrato ficar legível sem o usuário digitar nada
function greetingForNow(d = new Date()) {
  const h = d.getHours();
  if (h < 5) return 'Ainda de pé';
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function mealLabelForNow(d = new Date()) {
  const h = d.getHours();
  if (h < 10) return 'Café da manhã';
  if (h < 12) return 'Lanche da manhã';
  if (h < 15) return 'Almoço';
  if (h < 18) return 'Lanche da tarde';
  if (h < 22) return 'Jantar';
  return 'Ceia';
}

function timeLabel(d = new Date()) {
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function computeWaterGoalMl(weight) {
  const w = parseFloat(weight);
  if (!w) return 2000;
  return Math.round((w * 35) / 50) * 50; // arredonda pra múltiplo de 50ml
}

// Valores de MET (Compêndio de Atividades Físicas, referência científica padrão)
const WORKOUT_TYPES = {
  caminhada: { label: 'Caminhada', met: 3.8 },
  corrida: { label: 'Corrida', met: 9 },
  musculacao: { label: 'Musculação', met: 5.5 },
  ciclismo: { label: 'Ciclismo', met: 7.5 },
  natacao: { label: 'Natação', met: 7 },
  hiit: { label: 'HIIT / Funcional', met: 8 },
  yoga: { label: 'Yoga / Pilates', met: 3 },
  danca: { label: 'Dança', met: 5 },
};

// kcal = MET × peso(kg) × tempo(h) — fórmula padrão usada por calculadoras de gasto calórico
function estimateWorkoutKcal(workoutType, minutes, weight) {
  const met = (WORKOUT_TYPES[workoutType] || WORKOUT_TYPES.musculacao).met;
  const w = parseFloat(weight) || 70;
  const hours = (parseFloat(minutes) || 0) / 60;
  return Math.round(met * w * hours);
}

// Renderiza **negrito** e listas (linhas começando com * ou -) de forma bonita, sem libs externas
function renderRichText(text) {
  const renderInline = (line, keyPrefix) => {
    const segments = line.split(/(\*\*[^*]+\*\*)/g).filter(Boolean);
    return segments.map((seg, i) => {
      if (seg.startsWith('**') && seg.endsWith('**')) {
        return <strong key={`${keyPrefix}-${i}`} style={{ color: C.emerald }}>{seg.slice(2, -2)}</strong>;
      }
      return <React.Fragment key={`${keyPrefix}-${i}`}>{seg}</React.Fragment>;
    });
  };

  const lines = text.split('\n');
  const blocks = [];
  let currentList = [];

  const flushList = () => {
    if (currentList.length) {
      blocks.push(
        <ul key={`ul-${blocks.length}`} style={{ margin: '4px 0', paddingLeft: 18 }}>
          {currentList.map((item, i) => <li key={i} style={{ marginBottom: 3 }}>{renderInline(item, `li-${blocks.length}-${i}`)}</li>)}
        </ul>
      );
      currentList = [];
    }
  };

  lines.forEach((line, idx) => {
    const trimmed = line.trim();
    if (/^[\*\-]\s+/.test(trimmed)) {
      currentList.push(trimmed.replace(/^[\*\-]\s+/, ''));
    } else {
      flushList();
      if (trimmed) blocks.push(<p key={`p-${idx}`} style={{ margin: '0 0 6px' }}>{renderInline(trimmed, `p-${idx}`)}</p>);
    }
  });
  flushList();
  return blocks;
}

      console.error('[audio] microfone negado:', err.name, err.message);
      const msgs = [...messages, { id: Date.now(), from: 'dona', text: 'Não consegui acessar seu microfone. Confere a permissão do navegador e tenta de novo.' }];
      setMessages(msgs); save('chat_ui', msgs);
    }
  };

  const stopRecording = () => {
    const rec = recorderRef.current;
    if (rec && rec.state !== 'inactive') rec.stop();
    setRecording(false);
  };

  const cancelRecording = () => {
    chunksRef.current = [];
    const rec = recorderRef.current;
    if (rec && rec.state !== 'inactive') { rec.onstop = null; rec.stop(); }
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    setRecording(false);
    setRecSecs(0);
  };

  const finishRecording = async (mime) => {
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    const pedacos = chunksRef.current;
    chunksRef.current = [];
    if (!pedacos.length) return;
    setBusyLabel('DONA tá ouvindo...');
    setBusy(true);
    try {
      const blob = new Blob(pedacos, { type: mime || 'audio/webm' });
      const audio = await blobToWavBase64(blob);
      const caption = 'Segue um áudio meu. Escuta e responde no seu tom de sempre. Se eu estiver contando o que comi, estima as calorias e confirma comigo o que você entendeu antes de lançar.';
      setBusy(false);
      runDona({ id: Date.now(), from: 'user', text: caption, displayText: `🎙️ Áudio de ${recSecs}s`, audio: true }, caption, [audio]);
    } catch (err) {
      console.error('[audio] falhou:', err.name, err.message);
      setBusy(false);
      const msgs = [...messages, { id: Date.now(), from: 'dona', text: 'Não consegui processar esse áudio. Tenta gravar de novo, ou me escreve.' }];
      setMessages(msgs); save('chat_ui', msgs);
    } finally {
      setRecSecs(0);
    }
  };

  const handleAvatarChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    // guarda pequena e quadrada: a foto fica no aparelho, não sobe pra lugar nenhum
    const img = await fileToCompressedBase64(file, 256, 0.8);
    const p = { ...profile, picture: 'data:image/jpeg;base64,' + img.data };
    save('profile', p);
    setProfile(p);
  };

  const saveUserNotes = (novas) => {
    const atuais = load('dona_notes', []);
    const conhecidas = new Set(atuais.map(n => n.toLowerCase()));
    const merged = [...atuais];
    novas.forEach(n => {
      if (!conhecidas.has(n.toLowerCase())) { merged.push(n); conhecidas.add(n.toLowerCase()); }
    });
    save('dona_notes', merged.slice(-60)); // teto pra não crescer sem fim
  };

  const setContainerSize = (ml) => {
    setContainerMl(ml);
    save('container_ml', ml);
  };

  const runDona = async (userMsgForUi, apiText, images) => {
    const nextMsgs = [...messages, userMsgForUi];
    setMessages(nextMsgs); save('chat_ui', nextMsgs);
    setBusy(true);
    try {
      const profileSummary = buildProfileSummary(profile, daily);
      const rawReply = await askDona(geminiHistoryRef.current, apiText, images, profileSummary);

      // Notas: o que a DONA aprendeu sobre a pessoa e vale lembrar semanas depois
      const notas = [...rawReply.matchAll(/\[\[NOTA:([^\]]+)\]\]/g)].map(m => m[1].trim()).filter(Boolean);
      if (notas.length) saveUserNotes(notas);

      // Captura automática: se a DONA etiquetou uma estimativa de calorias, soma sozinho no painel
      const kcalMatch = rawReply.match(/\[\[KCAL:(\d+)\]\]/);
      let reply = rawReply
        .replace(/\[\[NOTA:[^\]]+\]\]/g, '')
        .replace(/\s*\[\[KCAL:\d+\]\]\s*/g, '')
        .trim();
      if (kcalMatch) {
        const kcal = parseInt(kcalMatch[1], 10);
        if (kcal > 0) {
          addLedgerEntry({ label: mealLabelForNow(), kcal: -kcal, source: 'foto' });
          reply += `\n\n**+${kcal} kcal** lançadas no seu extrato.`;
        }
      }

      const imageParts = (images || []).map(img => ({ inline_data: { mime_type: img.mimeType, data: img.data } }));
      const userParts = [...imageParts, { text: apiText }];
      geminiHistoryRef.current = [...geminiHistoryRef.current, { role: 'user', parts: userParts }, { role: 'model', parts: [{ text: rawReply }] }];
      save('chat_api', geminiHistoryRef.current);
      const finalMsgs = [...nextMsgs, { id: Date.now() + 1, from: 'dona', text: reply }];
      setMessages(finalMsgs); save('chat_ui', finalMsgs);
      logEvent(profile.id, profile.name, images && images.length ? 'midia_analisada' : 'mensagem_enviada', {});
    } catch (e) {
      console.error('[dona] falhou:', e.name, e.message);
      const tooBig = /413|payload|too large|body/i.test(e.message || '');
      const msg = e.name === 'AbortError'
        ? 'Demorei demais pra responder. Tenta de novo.'
        : tooBig
          ? 'Essa mídia ficou pesada demais pra mim. Tenta uma foto só, ou tira uma nova com menos zoom.'
          : 'Não consegui te responder agora, tenta de novo em instantes.';
      const finalMsgs = [...nextMsgs, { id: Date.now() + 1, from: 'dona', text: msg }];
      setMessages(finalMsgs); save('chat_ui', finalMsgs);
    } finally { setBusy(false); setBusyLabel('DONA tá digitando...'); }
  };

  const send = () => {
    const text = input.trim();
    if (!text || busy) return;
    setInput('');
    runDona({ id: Date.now(), from: 'user', text }, text);
  };

  const quickAsk = (text) => {
    if (busy) return;
    setTab('chat');
    runDona({ id: Date.now(), from: 'user', text }, text);
  };

  const askCardapio = () => {
    const cal = computeCalorieBreakdown(profile);
    const goalLabel = cal ? cal.goalLabel.toLowerCase() : 'minha meta';
    quickAsk(`Me dá dicas de cardápio pra quem quer ${goalLabel}${cal ? `, considerando uma meta de ${cal.target} kcal por dia` : ''}.`);
  };

  const askTreino = () => {
    const cal = computeCalorieBreakdown(profile);
    const goalLabel = cal ? cal.goalLabel.toLowerCase() : 'meu objetivo';
    quickAsk(`Me dá dicas de treino pra quem quer ${goalLabel}. Que tipo de abordagem faz mais sentido?`);
  };

  const handlePhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || busy) return;
    const previewUrl = URL.createObjectURL(file);
    setBusyLabel('DONA tá analisando a foto...');
    setBusy(true);
    const img = await fileToCompressedBase64(file);
    const caption = 'O que você vê nessa foto? Quantas calorias, mais ou menos, e tem algum ponto de atenção?';
    setBusy(false);
    runDona({ id: Date.now(), from: 'user', text: caption, displayText: '📷 Foto enviada', image: previewUrl }, caption, [img]);
  };

  const handleExecPhotos = async (e) => {
    const files = Array.from(e.target.files || []).slice(0, 6);
    e.target.value = '';
    if (!files.length || busy) return;
    setBusyLabel('DONA tá analisando as fotos...');
    setBusy(true);
    try {
      // várias fotos numa requisição só: comprime mais agressivo pra caber
      const images = await Promise.all(files.map(f => fileToCompressedBase64(f, 900, 0.65)));
      const previewUrl = URL.createObjectURL(files[0]);
      const caption = 'Aqui estão algumas fotos — pode ser comida/refeição ou a execução de um exercício em momentos diferentes. Analisa o que fizer mais sentido pelo que você está vendo e me ajuda (calorias, se for comida; dicas de execução, se for exercício).';
      setBusy(false);
      runDona({ id: Date.now(), from: 'user', text: caption, displayText: '🖼️ Fotos enviadas', image: previewUrl }, caption, images);
    } catch (err) {
      setBusy(false);
      const finalMsgs = [...messages, { id: Date.now(), from: 'dona', text: 'Não consegui ler essas fotos, tenta de novo.' }];
      setMessages(finalMsgs); save('chat_ui', finalMsgs);
    }
  };

  if (!profile) {
    return (
      <Phone>
        <div style={{ overflowY: 'auto', padding: '30px 22px 26px', flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column' }}>

          {onboardStep === 'auth' && (
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
              <Logo size={38} wordSize={26} />

              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingTop: 20 }}>
                <h1 className="display" style={{ fontSize: 40, color: C.text, margin: '0 0 14px', lineHeight: .95 }}>
                  Chega de<br /><span style={{ color: C.emerald }}>enrolação</span>.
                </h1>
                <p style={{ fontSize: 14, color: C.dim, lineHeight: 1.55, margin: '0 0 26px' }}>
                  Sem dieta milagrosa. Sem app te dando parabéns por beber água. Você registra, eu analiso, a gente ajusta.
                </p>

                <div style={{ display: 'flex', marginBottom: 18 }}>
                  {[['entrar', 'Entrar'], ['criar', 'Criar conta']].map(([id, label]) => (
                    <button key={id} onClick={() => { setAuthMode(id); setAuthError(''); }}
                      className="display"
                      style={{
                        flex: 1, background: 'transparent', border: 'none',
                        borderBottom: `2px solid ${authMode === id ? C.emerald : C.border}`,
                        color: authMode === id ? C.emerald : C.dim,
                        padding: '11px 0', fontSize: 14, letterSpacing: '.06em',
                      }}>{label}</button>
                  ))}
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <input type="email" inputMode="email" autoComplete="email" placeholder="Seu e-mail"
                    value={authEmail} onChange={e => setAuthEmail(e.target.value)} style={inputStyle} />
                  <input type="password" autoComplete={authMode === 'criar' ? 'new-password' : 'current-password'}
                    placeholder="Sua senha" value={authPass} onChange={e => setAuthPass(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleEmailAuth()} style={inputStyle} />

                  {authError && (
                    <p style={{ fontSize: 12, color: C.emerald, margin: 0, lineHeight: 1.45 }}>{authError}</p>
                  )}

                  <button onClick={handleEmailAuth} className="display"
                    style={{ background: C.emerald, color: C.onYellow, border: 'none', padding: '16px', fontSize: 16, letterSpacing: '.06em', marginTop: 2 }}>
                    {authMode === 'criar' ? 'Criar minha conta' : 'Entrar'}
                  </button>
                </div>

                {googleReady && (
                  <React.Fragment>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '22px 0 16px' }}>
                      <div style={{ flex: 1, height: 1, background: C.border }} />
                      <span className="mono-label" style={{ color: C.dim }}>ou</span>
                      <div style={{ flex: 1, height: 1, background: C.border }} />
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'center' }}>
                      <div ref={googleBtnRef}></div>
                    </div>
                  </React.Fragment>
                )}
              </div>

              <p style={{ fontSize: 10.5, color: C.dim, lineHeight: 1.5, margin: '20px 0 0' }}>
                Ao continuar você confirma ter 18 anos ou mais e concorda que o Papo Reto é orientação
                de estilo de vida, não prescrição médica.
              </p>
            </div>
          )}

          {onboardStep === 'welcome' && (
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 26 }}>
                <span style={{ width: 30, height: 30, borderRadius: 15, border: `2px solid ${C.emerald}`, display: 'inline-block', position: 'relative', flexShrink: 0 }}>
                  <span style={{ position: 'absolute', inset: 6, borderRadius: 8, background: C.emerald }} />
                </span>
                <span className="mono-label" style={{ color: C.emerald }}>Oi. Eu sou a DONA.</span>
              </div>

              <h1 className="display" style={{ fontSize: 38, color: C.text, margin: '0 0 18px', lineHeight: .97 }}>
                Eu não vou te<br />elogiar <span style={{ color: C.emerald }}>por pouco</span>.
              </h1>

              <p style={{ fontSize: 14.5, color: C.dim, lineHeight: 1.6, margin: '0 0 6px' }}>
                Sou sua mentora — não sou médica, nutricionista nem personal. Sou a voz que lembra do combinado quando ninguém está olhando.
              </p>

              <div style={{ margin: '22px 0 0' }}>
                {[
                  'Manda a foto do prato. Eu digo o que tem ali dentro e lanço no seu extrato.',
                  'Preguiça de digitar? Grava o áudio, me conta o que comeu, que eu escuto e lanço.',
                  'Geladeira vazia? Fotografa. Eu monto receita com o que você tem.',
                  'Dúvida na execução de um exercício? Manda as fotos que eu aponto o que ajustar.',
                  'Calculo sua meta de kcal e água em cima do seu objetivo — e recalculo quando você treina.',
                  'Te cutuco na hora certa: beber água, registrar refeição, hora do treino.',
                  'Sumiu três dias? Eu vou perguntar por quê.',
                ].map((t, i) => (
                  <div key={i} style={{ display: 'flex', gap: 13, padding: '11px 0', borderTop: `1px solid ${C.border}` }}>
                    <span className="mono-label" style={{ color: C.emerald, flexShrink: 0, paddingTop: 2 }}>0{i + 1}</span>
                    <span style={{ fontSize: 13.5, color: C.text, lineHeight: 1.45 }}>{t}</span>
                  </div>
                ))}
              </div>

              <div style={{ marginTop: 'auto', paddingTop: 24 }}>
                <p style={{ fontSize: 11, color: C.dim, lineHeight: 1.5, margin: '0 0 14px' }}>
                  Orientação prática, não prescrição médica. Condição de saúde ou uso de medicação? Fale com seu médico antes.
                </p>
                <button onClick={() => setOnboardStep('form')} className="display"
                  style={{ width: '100%', background: C.emerald, color: C.onYellow, border: 'none', padding: '17px', fontSize: 17, letterSpacing: '.06em' }}>
                  Combinado. Bora.
                </button>
              </div>
            </div>
          )}

          {onboardStep === 'form' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div>
              <p className="mono-label" style={{ color: C.emerald, margin: 0 }}>Último passo</p>
              <h1 className="display" style={{ fontSize: 30, color: C.text, margin: '2px 0 0', lineHeight: 1 }}>Seus números</h1>
            </div>

            {googleProfile && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 11, border: `1px solid ${C.border}`, padding: 11 }}>
                <img src={googleProfile.picture} style={{ width: 34, height: 34, borderRadius: 17 }} />
                <div style={{ minWidth: 0 }}>
                  <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{googleProfile.name}</p>
                  <p style={{ fontSize: 11, color: C.dim, margin: 0, overflow: 'hidden', textOverflow: 'ellipsis' }}>{googleProfile.email}</p>
                </div>
              </div>
            )}
            {!googleProfile && (
              <Field label="Nome">
                <input placeholder="Como você quer ser chamado" value={form.name} onChange={e => setForm({...form, name: e.target.value})} style={inputStyle} />
              </Field>
            )}

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
              <Field label="Peso">
                <input placeholder="kg" inputMode="decimal" value={form.weight} onChange={e => setForm({...form, weight: e.target.value})} style={inputStyle} />
              </Field>
              <Field label="Altura">
                <input placeholder="cm" inputMode="numeric" value={form.height} onChange={e => setForm({...form, height: e.target.value})} style={inputStyle} />
              </Field>
              <Field label="Idade">
                <input placeholder="anos" inputMode="numeric" value={form.age} onChange={e => setForm({...form, age: e.target.value})} style={inputStyle} />
              </Field>
            </div>

            <Field label="Sexo">
              <select value={form.sex} onChange={e => setForm({...form, sex: e.target.value})} style={selectStyle}>
                <option value="F">Feminino</option>
                <option value="M">Masculino</option>
              </select>
            </Field>

            <Field label="Objetivo">
              <select value={form.goal} onChange={e => setForm({...form, goal: e.target.value})} style={selectStyle}>
                <option value="emagrecer">Emagrecer</option>
                <option value="manter">Manter o peso</option>
                <option value="ganhar">Ganhar massa</option>
              </select>
            </Field>

            <Field label="Nível de atividade">
              <select value={form.activityLevel} onChange={e => setForm({...form, activityLevel: e.target.value})} style={selectStyle}>
                <option value="sedentario">Sedentário — pouco ou nenhum exercício</option>
                <option value="leve">Leve — exercício algumas vezes na semana</option>
                <option value="moderado">Moderado — exercício quase todos os dias</option>
                <option value="intenso">Intenso — exercício diário ou pesado</option>
              </select>
            </Field>

            <Field label="Treino">
              <select value={form.trains} onChange={e => setForm({...form, trains: e.target.value})} style={selectStyle}>
                <option value="sim">Já treino</option>
                <option value="nao">Ainda não treino</option>
              </select>
            </Field>

            {form.trains === 'sim' && (
              <React.Fragment>
                <Field label="Tipo de treino">
                  <select value={form.workoutType} onChange={e => setForm({...form, workoutType: e.target.value})} style={selectStyle}>
                    {Object.entries(WORKOUT_TYPES).map(([key, w]) => <option key={key} value={key}>{w.label}</option>)}
                  </select>
                </Field>

                <Field label="Horário que costuma treinar">
                  <input type="time" value={form.workoutTime} disabled={form.flexTime}
                    onChange={e => setForm({...form, workoutTime: e.target.value})}
                    style={{ ...inputStyle, opacity: form.flexTime ? .4 : 1 }} />
                  <button
                    onClick={() => setForm({ ...form, flexTime: !form.flexTime, workoutTime: !form.flexTime ? '' : form.workoutTime })}
                    style={{ display: 'flex', alignItems: 'center', gap: 9, background: 'none', border: 'none', padding: '10px 0 0', width: '100%', textAlign: 'left' }}>
                    <span style={{
                      width: 17, height: 17, flexShrink: 0,
                      border: `1px solid ${form.flexTime ? C.emerald : C.border}`,
                      background: form.flexTime ? C.emerald : 'transparent',
                      color: C.onYellow, fontSize: 12, lineHeight: '15px', textAlign: 'center', fontWeight: 700,
                    }}>{form.flexTime ? '✓' : ''}</span>
                    <span style={{ fontSize: 13, color: form.flexTime ? C.text : C.dim }}>Não tenho horário fixo</span>
                  </button>
                  {form.flexTime && (
                    <p style={{ fontSize: 11.5, color: C.dim, margin: '8px 0 0', lineHeight: 1.5 }}>
                      Sem horário fixo eu te cutuco de 3 em 3 horas perguntando se o treino já saiu.
                    </p>
                  )}
                </Field>
              </React.Fragment>
            )}

            <button onClick={completeOnboarding} className="display"
              style={{ background: C.emerald, color: C.onYellow, border: 'none', padding: '17px', fontSize: 17, letterSpacing: '.06em', marginTop: 6 }}>
              Entendi. Vamos.
            </button>
          </div>
          )}
        </div>
      </Phone>
    );
  }

  return (
    <Phone>
      <div style={{ flex: 1, overflow: 'hidden' }}>
        {tab === 'home' && (() => {
          const cal = computeCalorieBreakdown(profile);
          const entries = daily.entries || [];
          const consumed = daily.caloriesConsumed || 0;
          const workoutBonus = daily.workoutKcal || 0;
          const workoutCountsForMeta = profile.goal !== 'emagrecer';
          const target = cal ? cal.target + (workoutCountsForMeta ? workoutBonus : 0) : 0;
          const left = target - consumed;
          const pct = target ? Math.min(1, consumed / target) : 0;
          const over = left < 0;
          const near = !over && pct >= 0.85;
          const barColor = over ? C.red : C.emerald;

          const waterGoalMl = computeWaterGoalMl(profile.weight);
          const waterMl = daily.waterMl || 0;
          const waterSegments = 12;
          const waterFilled = Math.round(Math.min(1, waterMl / waterGoalMl) * waterSegments);

          const dateStr = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
          const dateCap = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

          return (
          <div style={{ height: '100%', overflowY: 'auto', padding: '18px 20px 20px' }}>

            {/* Cabeçalho: marca, data, saudação e sequência */}
            <div style={{ marginBottom: 14 }}><Logo size={26} wordSize={17} /></div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
              <div>
                <p className="display" style={{ fontSize: 21, color: C.text, margin: 0, lineHeight: 1 }}>{dateCap}</p>
                <p style={{ fontSize: 13, color: C.dim, margin: '6px 0 0' }}>{greetingForNow()}, {profile.name.split(' ')[0]}.</p>
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0, paddingLeft: 12 }}>
                <p className="display" style={{ fontSize: 24, color: C.emerald, margin: 0, lineHeight: 1 }}>{streak}</p>
                <p className="mono-label" style={{ color: C.dim, margin: '4px 0 0' }}>dias seguidos</p>
              </div>
            </div>

            {/* Card da DONA em destaque, bloco chapado amarelo */}
            <button onClick={() => setTab('chat')} style={{ width: '100%', textAlign: 'left', background: C.emerald, border: 'none', padding: '16px 18px 14px', marginBottom: 22, display: 'block' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                <span style={{ width: 16, height: 16, borderRadius: 8, border: `2px solid ${C.onYellow}`, display: 'inline-block', position: 'relative', flexShrink: 0 }}>
                  <span style={{ position: 'absolute', inset: 3, borderRadius: 4, background: C.onYellow }} />
                </span>
                <span className="mono-label" style={{ color: C.onYellow, fontWeight: 700 }}>DONA</span>
              </div>
              <p style={{ fontSize: 14.5, lineHeight: 1.45, color: C.onYellow, margin: 0, fontWeight: 500 }}>
                {messages.length && messages[messages.length - 1].from === 'dona'
                  ? messages[messages.length - 1].text.replace(/\*\*/g, '').slice(0, 130) + (messages[messages.length - 1].text.length > 130 ? '…' : '')
                  : 'Manda a foto do seu prato. Eu digo o que tem ali dentro.'}
              </p>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12, paddingTop: 10, borderTop: '1px solid rgba(11,11,11,.25)' }}>
                <span className="mono-label" style={{ color: C.onYellow, fontWeight: 700 }}>Responder pra DONA</span>
                <span style={{ color: C.onYellow, fontSize: 15 }}>→</span>
              </div>
            </button>

            {/* Saldo do dia */}
            <p className="mono-label" style={{ color: C.dim, margin: '0 0 8px' }}>Saldo do dia</p>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
              <span className="display" style={{ fontSize: 52, color: over ? C.red : C.text, lineHeight: .9 }}>
                {over ? '+' + Math.abs(left) : left}
              </span>
              <span style={{ fontSize: 13, color: C.dim }}>{over ? 'kcal acima da meta' : 'kcal restantes'}</span>
            </div>

            <div style={{ display: 'flex', height: 6, background: 'rgba(255,255,255,.10)', margin: '14px 0 10px' }}>

                      <p className="mono-label" style={{ color: C.dim, margin: '0 0 10px' }}>Como executar</p>
                      {ex.tips.map((t, i) => (
                        <div key={i} style={{ display: 'flex', gap: 11, marginBottom: 8 }}>
                          <span className="mono-label" style={{ color: C.emerald, flexShrink: 0, paddingTop: 3 }}>0{i + 1}</span>
                          <span style={{ fontSize: 13.5, color: C.text, lineHeight: 1.5 }}>{t}</span>
                        </div>
                      ))}
                      <div style={{ background: C.emerald, color: C.onYellow, padding: '11px 13px', margin: '14px 0 12px' }}>
                        <p className="mono-label" style={{ margin: '0 0 5px', fontWeight: 700 }}>Erro mais comum</p>
                        <p style={{ fontSize: 13, margin: 0, lineHeight: 1.45, fontWeight: 500 }}>{ex.attention}</p>
                      </div>
                      <a href={youtubeSearchUrl(ex.name)} target="_blank" rel="noopener noreferrer"
                        className="mono-label"
                        style={{ display: 'block', textAlign: 'center', border: `1px solid ${C.border}`, color: C.text, padding: '11px', textDecoration: 'none' }}>
                        Ver execução no YouTube →
                      </a>
                    </div>
                  )}
                </div>
              );
            })}

            <p style={{ fontSize: 11.5, color: C.dim, marginTop: 22, lineHeight: 1.5, borderTop: `1px solid ${C.border}`, paddingTop: 16 }}>
              Vai treinar? Manda as fotos da sua execução pra DONA no chat que ela te dá dicas do seu movimento.
            </p>
          </div>
        )}
      </div>

      <div style={{ display: 'flex', borderTop: `1px solid ${C.border}`, background: C.bg, flexShrink: 0 }}>
        {[['home','Painel'], ['chat','DONA'], ['galeria','Exercícios'], ['perfil','Perfil']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            className="display"
            style={{
              flex: 1, background: 'none', border: 'none',
              borderTop: `3px solid ${tab === id ? C.emerald : 'transparent'}`,
              marginTop: -1, padding: '14px 0 13px',
              color: tab === id ? C.emerald : C.dim,
              fontSize: 12, letterSpacing: '.1em',
            }}>{label}</button>
        ))}
      </div>
    </Phone>
  );
}
