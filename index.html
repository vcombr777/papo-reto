function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

async function subscribeToPush(userId) {
  if (SUPABASE_ANON_KEY.startsWith('COLE_AQUI')) return { ok: false, reason: 'not_configured' };
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return { ok: false, reason: 'not_supported' };
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return { ok: false, reason: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }
  const subJson = sub.toJSON();
  await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,

      'Prefer': 'resolution=merge-duplicates',
    },
    body: JSON.stringify({ user_id: userId, endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth: subJson.keys.auth }),
  }).catch(() => {});
  return { ok: true };

async function askDona(history, text, images, profileSummary) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch(DONA_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history, text, images, profileSummary }),
      signal: controller.signal,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'erro');
    return data.text;
  } finally {
    clearTimeout(timeoutId);
  }
}

  if (!profile) return '';

  const waterGoal = computeWaterGoalMl(profile.weight);
  const parts = [
    `Nome: ${profile.name}`,
    profile.age ? `Idade: ${profile.age} anos` : null,
    profile.sex ? `Sexo: ${profile.sex === 'M' ? 'masculino' : 'feminino'}` : null,
    profile.weight ? `Peso: ${profile.weight}kg` : null,
    profile.height ? `Altura: ${profile.height}cm` : null,
    cal ? `Objetivo: ${cal.goalLabel}` : null,
    cal ? `Meta calórica diária calculada: ${cal.target} kcal` : null,
    `Meta de água diária: ${(waterGoal / 1000).toFixed(1)}L`,
    profile.trains ? `Treina: ${(WORKOUT_TYPES[profile.workoutType] || {}).label || profile.workoutType}${profile.workoutTime ? `, geralmente às ${profile.workoutTime}` : ''}` : 'Ainda não tem rotina de treino definida',
    daily && daily.sleepHours ? `Sono relatado hoje: ${daily.sleepHours}h` : null,
    daily && daily.workoutKcal ? `Estimativa de kcal queimadas no treino de hoje: ${daily.workoutKcal}` : null,
    daily && daily.caloriesConsumed ? `Calorias já registradas hoje: ${daily.caloriesConsumed} kcal` : null,
  ].filter(Boolean);
  return parts.join(' | ');
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Extrai N quadros espalhados ao longo do vídeo, direto no navegador (nada é enviado como vídeo bruto).
function extractVideoFrames(file, frameCount = 5, maxWidth = 480) {
  console.log('[video] iniciando extração. arquivo:', file.name, file.type, (file.size / 1024 / 1024).toFixed(2) + 'MB');
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    // Fica dentro da área visível (não em -9999px) pra evitar que o iOS pause a
    // decodificação de vídeos que ele considera "fora de tela". Invisível por opacidade, não por posição.
    video.style.position = 'fixed';
    video.style.top = '0';
    video.style.left = '0';
    video.style.width = '2px';
    video.style.height = '2px';
    video.style.opacity = '0.01';
    video.style.pointerEvents = 'none';
    document.body.appendChild(video);

    const url = URL.createObjectURL(file);
    video.src = url;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const frames = [];
    let finished = false;
    let targets = [];
    let targetIdx = 0;

    const cleanup = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timeoutId);
      try { video.pause(); } catch (e) {}
      URL.revokeObjectURL(url);
      if (video.parentNode) video.parentNode.removeChild(video);
    };

    const timeoutId = setTimeout(() => {
      if (finished) return;
      cleanup();
      if (frames.length > 0) resolve(frames);
      else reject(new Error('Tempo esgotado lendo o vídeo'));
    }, 20000);

    const grabFrame = () => {
      try {
        const scale = Math.min(1, maxWidth / (video.videoWidth || maxWidth));
        canvas.width = Math.max(1, Math.round((video.videoWidth || maxWidth) * scale));
        canvas.height = Math.max(1, Math.round((video.videoHeight || maxWidth) * scale));
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        frames.push(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
        console.log('[video] quadro capturado', frames.length, 'de', frameCount);
      } catch (e) {
        console.error('[video] erro ao capturar quadro:', e.name, e.message);
      }
    };

    const finishUp = () => {
      console.log('[video] finalizado, total de quadros:', frames.length);
      cleanup();
      resolve(frames);
    };

    // Método principal: reproduz o vídeo de verdade (mudo) e captura quadros
    // conforme ele passa pelos tempos-alvo — é o jeito recomendado pra funcionar no iOS.
    const runByPlayback = () => {
      console.log('[video] usando requestVideoFrameCallback');
      const onFrame = (now, metadata) => {
        if (finished) return;
        const t = metadata.mediaTime;
        if (targetIdx < targets.length && t >= targets[targetIdx]) {
          grabFrame();
          targetIdx += 1;
        }
        if (targetIdx >= targets.length) { finishUp(); return; }
        video.requestVideoFrameCallback(onFrame);
      };
      video.requestVideoFrameCallback(onFrame);
      video.play().then(() => {
        console.log('[video] play() iniciou com sucesso');
      }).catch((e) => {
        console.error('[video] play() falhou:', e.name, e.message, '-> caindo pro método de busca');
        runBySeek();
      });
    };

    // Método reserva: pula ponto a ponto (usado se o navegador não suportar o método acima)
    const runBySeek = () => {
      console.log('[video] usando método de busca (seek)');
      let seekIndex = 0;
      const seekNext = () => { if (!finished) video.currentTime = targets[seekIndex]; };
      video.onseeked = () => {
        if (finished) return;
        grabFrame();
        seekIndex += 1;
        if (seekIndex < targets.length) seekNext();
        else finishUp();
      };
      seekNext();
    };

    video.onloadedmetadata = () => {
      console.log('[video] metadados carregados. duração:', video.duration, 'dimensões:', video.videoWidth, 'x', video.videoHeight, 'rVFC disponível:', typeof video.requestVideoFrameCallback === 'function');
      const dur = video.duration || 1;
      targets = Array.from({ length: frameCount }, (_, i) => (dur * (i + 1)) / (frameCount + 1));
      if (typeof video.requestVideoFrameCallback === 'function') runByPlayback();
      else runBySeek();
    };
    video.onerror = () => {
      console.error('[video] evento de erro do elemento <video>. código:', video.error && video.error.code, 'mensagem:', video.error && video.error.message);
      cleanup();
      reject(new Error('Não consegui ler esse vídeo'));
    };
  });
}

// Fórmula de Mifflin-St Jeor (padrão usado por calculadoras de calorias) + fator de atividade (Harris-Benedict)
function computeCalorieBreakdown(profile) {
  const weight = parseFloat(profile.weight);
  const height = parseFloat(profile.height);
  const age = parseFloat(profile.age);
  if (!weight || !height || !age) return null;

  const bmr = profile.sex === 'M'
    ? 10 * weight + 6.25 * height - 5 * age + 5
    : 10 * weight + 6.25 * height - 5 * age - 161;

  const activity = ACTIVITY_FACTORS[profile.activityLevel] || ACTIVITY_FACTORS.leve;
  const tdee = bmr * activity.factor;

  const goal = GOAL_INFO[profile.goal] || GOAL_INFO.manter;
  const target = tdee * (1 + goal.adjustPct);

  return {
    bmr: Math.round(bmr),
    activityLabel: activity.label,
    tdee: Math.round(tdee),
    goalLabel: goal.label,
    adjustKcal: Math.round(tdee * goal.adjustPct),
    target: Math.round(target),
  };
}

// Referência clássica de hidratação: ~35ml de água por kg de peso corporal
function computeWaterGoalMl(weight) {
  const w = parseFloat(weight);
  if (!w) return 2000;
  return Math.round((w * 35) / 50) * 50; // arredonda pra múltiplo de 50ml
}

// kcal = MET × peso(kg) × tempo(h) — fórmula padrão usada por calculadoras de gasto calórico
function estimateWorkoutKcal(workoutType, minutes, weight) {
  const met = (WORKOUT_TYPES[workoutType] || WORKOUT_TYPES.musculacao).met;
  const w = parseFloat(weight) || 70;
  const hours = (parseFloat(minutes) || 0) / 60;
  return Math.round(met * w * hours);
}

// Renderiza **negrito** e listas (linhas começando com * ou -) de forma bonita, sem libs externas
function renderRichText(text) {
  const renderInline = (line, keyPrefix) => {
    const segments = line.split(/(\*\*[^*]+\*\*)/g).filter(Boolean);
    return segments.map((seg, i) => {
      if (seg.startsWith('**') && seg.endsWith('**')) {
        return <strong key={`${keyPrefix}-${i}`} style={{ color: C.emerald }}>{seg.slice(2, -2)}</strong>;
      }
      return <React.Fragment key={`${keyPrefix}-${i}`}>{seg}</React.Fragment>;
    });
  };

  const lines = text.split('\n');
  const blocks = [];
  let currentList = [];

  const flushList = () => {
    if (currentList.length) {
      blocks.push(
        <ul key={`ul-${blocks.length}`} style={{ margin: '4px 0', paddingLeft: 18 }}>
          {currentList.map((item, i) => <li key={i} style={{ marginBottom: 3 }}>{renderInline(item, `li-${blocks.length}-${i}`)}</li>)}
        </ul>
      );
      currentList = [];
    }
  };

  lines.forEach((line, idx) => {
    const trimmed = line.trim();
    if (/^[\*\-]\s+/.test(trimmed)) {
      currentList.push(trimmed.replace(/^[\*\-]\s+/, ''));
    } else {
      flushList();
      if (trimmed) blocks.push(<p key={`p-${idx}`} style={{ margin: '0 0 6px' }}>{renderInline(trimmed, `p-${idx}`)}</p>);
    }
  });
  flushList();
  return blocks;
}

function Ring({ pct, size = 108, color }) {
  const stroke = 9, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={size/2} cy={size/2} r={r} stroke={C.border} strokeWidth={stroke} fill="none" />
      <circle cx={size/2} cy={size/2} r={r} stroke={color || C.emerald} strokeWidth={stroke} fill="none"
        strokeDasharray={c} strokeDashoffset={c - c * Math.min(1, pct)} strokeLinecap="round" style={{ transition: 'stroke 0.3s' }} />
    </svg>
  );
}

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function Phone({ children }) {
  return (
    <div className="app-outer">
      <div className="phone-shell">
        {children}
      </div>
    </div>
  );
}

                <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>Fala com a DONA</p>
                <p style={{ fontSize: 12, color: 'rgba(248,250,252,0.85)', margin: '2px 0 0', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                  {messages.length ? messages[messages.length - 1].text : 'Toque pra começar a conversa'}
                </p>
              </div>
              <span style={{ color: C.text, fontSize: 18 }}>›</span>
            </button>

            {(() => {
              const cal = computeCalorieBreakdown(profile);
              const waterGoalMl = computeWaterGoalMl(profile.weight);
              const waterMl = daily.waterMl || 0;
              const waterL = (waterMl / 1000).toFixed(1);
              const goalL = (waterGoalMl / 1000).toFixed(1);
              const waterPct = Math.min(1, waterMl / waterGoalMl);
              const consumed = daily.caloriesConsumed || 0;
              const workoutBonus = daily.workoutKcal || 0;
              const workoutCountsForMeta = profile.goal !== 'emagrecer';
              const adjustedTarget = cal ? cal.target + (workoutCountsForMeta ? workoutBonus : 0) : 0;
              const eatenPct = cal ? Math.min(1, consumed / adjustedTarget) : 0;
              const ringColor = eatenPct >= 1 ? '#EF4444' : eatenPct >= 0.85 ? C.amber : C.emerald;
              return (
                <React.Fragment>
                  <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 20, marginBottom: 16 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
                      <div style={{ position: 'relative', width: 108, height: 108 }}>
                        <Ring pct={eatenPct} color={ringColor} />
                        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                          <span style={{ fontSize: 16, fontWeight: 900, color: eatenPct >= 1 ? '#EF4444' : C.text }}>{consumed}</span>
                          <span style={{ fontSize: 9, fontWeight: 600, color: C.dim }}>de {cal ? adjustedTarget : '—'} kcal</span>
                        </div>
                      </div>
                      <div style={{ flex: 1 }}>
                        <p style={{ fontSize: 14, fontWeight: 600, color: C.text, margin: 0 }}>{cal ? cal.goalLabel : 'Complete seu perfil'}</p>
                        <p style={{ fontSize: 12, color: C.dim, marginTop: 4 }}>
                          {workoutBonus > 0
                            ? (workoutCountsForMeta
                                ? `Meta base ${cal ? cal.target : '—'} + ${workoutBonus} do treino de hoje.`
                                : `${workoutBonus} kcal queimadas no treino — mantidas fora da meta pra preservar o déficit.`)
                            : 'Manda fotos das refeições, a DONA estima a caloria.'}
                        </p>
                        {cal && (
                          <button onClick={() => setShowBreakdown(s => !s)} style={{ background: 'none', border: 'none', color: C.emerald, fontSize: 11, fontWeight: 700, padding: 0, marginTop: 6 }}>
                            {showBreakdown ? 'Esconder a conta ▲' : 'Ver a conta ▼'}
                          </button>
                        )}
                      </div>
                    </div>
                    {cal && showBreakdown && (
                      <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.border}`, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                        <div style={{ background: C.cardAlt, borderRadius: 8, padding: 8 }}>
                          <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>TMB (basal)</p>
                          <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{cal.bmr} kcal</p>
                        </div>
                        <div style={{ background: C.cardAlt, borderRadius: 8, padding: 8 }}>
                          <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>+ atividade ({cal.activityLabel.split(' ')[0]})</p>
                          <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{cal.tdee} kcal</p>
                        </div>
                        <div style={{ background: C.cardAlt, borderRadius: 8, padding: 8, gridColumn: '1 / -1' }}>
                          <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>Ajuste pro objetivo ({cal.goalLabel})</p>
                          <p style={{ fontSize: 13, fontWeight: 700, color: C.text, margin: 0 }}>{cal.adjustKcal >= 0 ? '+' : ''}{cal.adjustKcal} kcal → meta final {cal.target} kcal</p>
                        </div>
                      </div>
                    )}
                    <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${C.border}`, display: 'flex', gap: 8, alignItems: 'center' }}>
                      <input
                        type="number"
                        placeholder="kcal que comeu agora"
                        value={mealKcalInput}
                        onChange={e => setMealKcalInput(e.target.value)}
                        style={{ ...inputStyle, padding: '10px 12px', fontSize: 12 }}
                      />
                      <button
                        onClick={() => {
                          const add = parseInt(mealKcalInput) || 0;
                          if (add > 0) updateDaily({ caloriesConsumed: consumed + add });
                          setMealKcalInput('');
                        }}
                        style={{ background: C.emeraldDim, color: C.text, border: 'none', borderRadius: 8, padding: '10px 16px', fontSize: 12, fontWeight: 700, flexShrink: 0 }}
                      >
                        + registrar
                      </button>
                    </div>
                    {consumed > 0 && (
                      <button onClick={() => updateDaily({ caloriesConsumed: 0 })} style={{ background: 'none', border: 'none', color: C.dim, fontSize: 10, padding: 0, marginTop: 8, textDecoration: 'underline' }}>
                        zerar registro de hoje
                      </button>
                    )}
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
                    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16 }}>
                      <p style={{ fontSize: 18, fontWeight: 900, color: C.text, margin: '8px 0 0' }}>{waterL}L / {goalL}L</p>
                      <p style={{ fontSize: 10, fontWeight: 600, color: C.dim, marginBottom: 6 }}>água hoje</p>
                      <div style={{ height: 4, borderRadius: 2, background: C.cardAlt, marginBottom: 8, overflow: 'hidden' }}>
                        <div style={{ height: '100%', width: `${waterPct * 100}%`, background: C.emerald }} />
                      </div>
                      <button onClick={() => updateDaily({ waterMl: waterMl + containerMl })} style={{ width: '100%', background: C.emeraldDim, color: C.text, border: 'none', borderRadius: 8, padding: '6px', fontSize: 11, fontWeight: 700, marginBottom: 6 }}>
                        + {containerMl}ml
                      </button>
                      <div style={{ display: 'flex', gap: 4 }}>
                        {[200, 500, 750].map(ml => (
                          <button key={ml} onClick={() => setContainerSize(ml)} style={{ flex: 1, background: containerMl === ml ? C.emerald : C.cardAlt, color: containerMl === ml ? '#022c1a' : C.dim, border: 'none', borderRadius: 6, padding: '4px', fontSize: 9, fontWeight: 700 }}>
                            {ml >= 1000 ? (ml/1000)+'L' : ml+'ml'}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16 }}>
                      <p style={{ fontSize: 18, fontWeight: 900, color: C.text, margin: '8px 0 0' }}>{daily.sleepHours ?? '—'}h</p>
                      <p style={{ fontSize: 10, fontWeight: 600, color: C.dim, marginBottom: 8 }}>sono essa noite</p>
                      <div style={{ display: 'flex', gap: 4 }}>
                        {[5,7,9].map(h => <button key={h} onClick={() => updateDaily({ sleepHours: h })} style={{ flex: 1, background: C.cardAlt, color: C.dim, border: 'none', borderRadius: 6, padding: '4px', fontSize: 10, fontWeight: 700 }}>{h}h</button>)}
                      </div>
                    </div>
                  </div>
                </React.Fragment>
              );
            })()}

            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16, marginBottom: 16 }}>
              <p style={{ fontSize: 12, fontWeight: 700, color: C.text, margin: '0 0 10px' }}>Registrar treino de hoje</p>
              <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                <select value={workoutTypeInput} onChange={e => setWorkoutTypeInput(e.target.value)} style={{ ...inputStyle, padding: '10px 12px', fontSize: 12 }}>
                  {Object.entries(WORKOUT_TYPES).map(([key, w]) => <option key={key} value={key}>{w.label}</option>)}
                </select>
                <input type="number" placeholder="min" value={workoutMinutes} onChange={e => setWorkoutMinutes(e.target.value)} style={{ ...inputStyle, padding: '10px 12px', fontSize: 12, flex: '0 0 70px' }} />
              </div>
              <button
                onClick={() => updateDaily({ workoutKcal: estimateWorkoutKcal(workoutTypeInput, workoutMinutes, profile.weight), workoutMinutesLogged: workoutMinutes })}
                style={{ width: '100%', background: C.emeraldDim, color: C.text, border: 'none', borderRadius: 8, padding: '8px', fontSize: 12, fontWeight: 700 }}
              >
                Calcular calorias queimadas
              </button>
              {!!daily.workoutKcal && (
                <p style={{ fontSize: 12, color: C.emerald, margin: '10px 0 0', textAlign: 'center' }}>
                  ≈ {daily.workoutKcal} kcal queimadas (estimativa)
                </p>
              )}
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <button onClick={askCardapio} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 14, textAlign: 'left', opacity: busy ? 0.5 : 1 }}>
                <p style={{ fontSize: 18, margin: '0 0 6px' }}>🍽️</p>
                <p style={{ fontSize: 12, fontWeight: 700, color: C.text, margin: 0 }}>Dicas de cardápio</p>
              </button>
              <button onClick={askTreino} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 14, textAlign: 'left', opacity: busy ? 0.5 : 1 }}>
                <p style={{ fontSize: 18, margin: '0 0 6px' }}>🏋️</p>
                <p style={{ fontSize: 12, fontWeight: 700, color: C.text, margin: 0 }}>Dicas de treino</p>
              </button>
            </div>
          </div>
        )}

        {tab === 'perfil' && (
          <div style={{ height: '100%', overflowY: 'auto', padding: '16px 20px' }}>
            <p style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, color: C.emerald, margin: 0 }}>PERFIL</p>
            <h1 style={{ fontSize: 20, fontWeight: 900, color: C.text, margin: '4px 0 16px' }}>Seus dados</h1>

            {profile.picture && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
                <img src={profile.picture} style={{ width: 48, height: 48, borderRadius: 24 }} />
                <div>
                  <p style={{ fontSize: 15, fontWeight: 700, color: C.text, margin: 0 }}>{profile.name}</p>
                  {profile.email && <p style={{ fontSize: 11, color: C.dim, margin: 0 }}>{profile.email}</p>}
                </div>
              </div>
            )}

            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16, marginBottom: 12 }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                <div>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>peso</p>
                  <p style={{ fontSize: 15, fontWeight: 700, color: C.text, margin: 0 }}>{profile.weight}kg</p>
                </div>
                <div>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>altura</p>
                  <p style={{ fontSize: 15, fontWeight: 700, color: C.text, margin: 0 }}>{profile.height}cm</p>
                </div>
                <div>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>idade</p>
                  <p style={{ fontSize: 15, fontWeight: 700, color: C.text, margin: 0 }}>{profile.age} anos</p>
                </div>
                <div>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>atividade</p>
                  <p style={{ fontSize: 15, fontWeight: 700, color: C.text, margin: 0 }}>{(ACTIVITY_FACTORS[profile.activityLevel] || ACTIVITY_FACTORS.leve).label.split(' ')[0]}</p>
                </div>
              </div>
            </div>

            {(() => {
              const cal = computeCalorieBreakdown(profile);
              return cal && (
                <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16, marginBottom: 12 }}>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>objetivo</p>
                  <p style={{ fontSize: 15, fontWeight: 700, color: C.emerald, margin: '0 0 10px' }}>{cal.goalLabel}</p>
                  <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>meta calórica diária</p>
                  <p style={{ fontSize: 15, fontWeight: 700, color: C.text, margin: 0 }}>{cal.target} kcal</p>
                </div>
              );
            })()}

            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16, marginBottom: 12 }}>
              <p style={{ fontSize: 9, color: C.dim, margin: 0 }}>treino</p>
              {profile.trains ? (
                <React.Fragment>
                  <p style={{ fontSize: 15, fontWeight: 700, color: C.text, margin: '0 0 4px' }}>{(WORKOUT_TYPES[profile.workoutType] || {}).label || profile.workoutType}</p>
                  {profile.workoutTime && <p style={{ fontSize: 11, color: C.dim, margin: 0 }}>geralmente às {profile.workoutTime}</p>}
                </React.Fragment>
              ) : (
                <p style={{ fontSize: 13, color: C.dim, margin: '4px 0 0' }}>Ainda sem rotina de treino definida</p>
              )}
            </div>

            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: 16, marginBottom: 12 }}>
              <p style={{ fontSize: 12, fontWeight: 700, color: C.text, margin: '0 0 10px' }}>Notificações</p>
              {notifStatus !== 'ok' ? (
                <React.Fragment>
                  <button onClick={handleActivateNotifications} disabled={notifStatus === 'asking'} style={{ width: '100%', background: C.emeraldDim, color: C.text, border: 'none', borderRadius: 10, padding: '10px', fontSize: 12, fontWeight: 700, marginBottom: 6 }}>
                    {notifStatus === 'asking' ? 'Aguardando permissão...' : '🔔 Ativar notificações'}
                  </button>
                  {notifStatus === 'error' && (
                    <p style={{ fontSize: 10, color: C.amber, margin: 0 }}>Não deu pra ativar — confere se permitiu notificações no navegador.</p>
                  )}
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <p style={{ fontSize: 11, color: C.emerald, margin: '0 0 10px' }}>✓ Notificações ativadas</p>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <p style={{ fontSize: 12, color: C.text, margin: 0 }}>Lembrete de água (de hora em hora)</p>
                    <button onClick={toggleNotifWater} style={{ background: notifWater ? C.emerald : C.cardAlt, color: notifWater ? '#022c1a' : C.dim, border: 'none', borderRadius: 999, padding: '4px 10px', fontSize: 10, fontWeight: 700 }}>
                      {notifWater ? 'Ligado' : 'Desligado'}
                    </button>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <p style={{ fontSize: 12, color: C.text, margin: 0 }}>Lembrete de refeição</p>
                    <button onClick={toggleNotifMeal} style={{ background: notifMeal ? C.emerald : C.cardAlt, color: notifMeal ? '#022c1a' : C.dim, border: 'none', borderRadius: 999, padding: '4px 10px', fontSize: 10, fontWeight: 700 }}>
                      {notifMeal ? 'Ligado' : 'Desligado'}
                    </button>
                  </div>
                  {profile.trains && <p style={{ fontSize: 10, color: C.dim, marginTop: 8 }}>Lembrete de treino segue o horário cadastrado no seu perfil.</p>}
                </React.Fragment>
              )}
            </div>

            <button onClick={resetProfile} style={{ width: '100%', background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: '12px', color: C.dim, fontSize: 12, fontWeight: 700, marginTop: 8 }}>
              Trocar perfil / sair
            </button>
          </div>
        )}

        {tab === 'chat' && (
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
            <div style={{ padding: '16px 20px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: `1px solid ${C.border}` }}>
              <div style={{ width: 36, height: 36, borderRadius: 18, background: C.emerald, color: '#022c1a', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900 }}>D</div>
              <div>
                <p style={{ fontSize: 14, fontWeight: 700, color: C.text, margin: 0 }}>DONA</p>
                <p style={{ fontSize: 10, color: C.dim, margin: 0 }}>mentora do Papo Reto</p>
              </div>
            </div>
            <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
              {messages.map(m => (
                <div key={m.id} style={{ display: 'flex', justifyContent: m.from === 'user' ? 'flex-end' : 'flex-start' }}>
                  {m.image ? (
                    <div style={{ maxWidth: '80%', background: m.from === 'user' ? C.emeraldDim : C.card, border: m.from === 'dona' ? `1px solid ${C.border}` : 'none', borderRadius: 16, overflow: 'hidden' }}>
                      <img src={m.image} style={{ display: 'block', width: '100%', maxHeight: 220, objectFit: 'cover' }} />
                      <p style={{ margin: 0, padding: '8px 14px', fontSize: 12, fontWeight: 600, color: m.from === 'user' ? 'rgba(248,250,252,0.9)' : C.dim }}>
                        {m.displayText || (m.from === 'user' ? '📷 Foto enviada' : '')}
                      </p>
                    </div>
                  ) : (
                    <div style={{ maxWidth: '80%', background: m.from === 'user' ? C.emeraldDim : C.card, color: C.text, border: m.from === 'dona' ? `1px solid ${C.border}` : 'none', borderRadius: 16, padding: '10px 16px', fontSize: 14 }}>
                      {m.from === 'dona' ? renderRichText(m.text) : m.text}
                    </div>
                  )}
                </div>
              ))}
              {busy && <div style={{ fontSize: 11, color: C.dim }}>{busyLabel}</div>}
            </div>
            <div style={{ padding: 12, display: 'flex', gap: 8, borderTop: `1px solid ${C.border}` }}>
              <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={handlePhoto} />
              <input ref={execPhotosRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={handleExecPhotos} />
              <input ref={videoInputRef} type="file" accept="video/*" style={{ display: 'none' }} onChange={handleVideo} />
              <button onClick={() => fileInputRef.current.click()} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 999, width: 40, height: 40 }}>📷</button>
              <button onClick={() => execPhotosRef.current.click()} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 999, width: 40, height: 40 }}>🖼️</button>
              <button onClick={() => videoInputRef.current.click()} disabled={busy} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 999, width: 40, height: 40 }}>🎥</button>
              <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Manda o papo..." disabled={busy} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 999, padding: '10px 16px', color: C.text, fontSize: 14 }} />
              <button onClick={send} disabled={busy} style={{ background: C.emerald, border: 'none', borderRadius: 999, width: 40, height: 40, opacity: busy ? 0.5 : 1 }}>➤</button>
            </div>
          </div>
        )}

        {tab === 'galeria' && (
          <div style={{ height: '100%', overflowY: 'auto', padding: '16px 20px' }}>
            <p style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, color: C.emerald, margin: 0 }}>GALERIA</p>
            <h1 style={{ fontSize: 20, fontWeight: 900, color: C.text, margin: '4px 0 12px' }}>Referência de execução</h1>
            <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 12, marginBottom: 4 }}>
              {['Todos', ...MUSCLE_GROUPS].map(g => (
                <button key={g} onClick={() => setGalleryGroup(g)} style={{ flexShrink: 0, background: galleryGroup === g ? C.emerald : C.card, color: galleryGroup === g ? '#022c1a' : C.dim, border: `1px solid ${galleryGroup === g ? C.emerald : C.border}`, borderRadius: 999, padding: '6px 14px', fontSize: 11, fontWeight: 700 }}>
                  {g}
                </button>
              ))}
            </div>
            {EXERCISES.filter(ex => galleryGroup === 'Todos' || ex.group === galleryGroup).map(ex => (
              <div key={ex.id} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
                <button onClick={() => setExpandedExercise(expandedExercise === ex.id ? null : ex.id)} style={{ width: '100%', textAlign: 'left', background: 'none', border: 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <p style={{ fontSize: 9, color: C.emerald, fontWeight: 700, margin: 0 }}>{ex.group.toUpperCase()}</p>
                    <p style={{ fontSize: 14, fontWeight: 700, color: C.text, margin: 0 }}>{ex.name}</p>
                  </div>
                  <span style={{ color: C.dim, fontSize: 12 }}>{expandedExercise === ex.id ? '▲' : '▼'}</span>
                </button>
                {expandedExercise === ex.id && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
                    <p style={{ fontSize: 10, fontWeight: 700, color: C.dim, margin: '0 0 6px' }}>DICAS DE EXECUÇÃO</p>
                    <ul style={{ margin: '0 0 10px', paddingLeft: 18 }}>
                      {ex.tips.map((t, i) => <li key={i} style={{ fontSize: 12, color: C.text, marginBottom: 4 }}>{t}</li>)}
                    </ul>
                    <div style={{ background: C.cardAlt, borderRadius: 8, padding: 10, marginBottom: 10 }}>
                      <p style={{ fontSize: 10, fontWeight: 700, color: C.amber, margin: '0 0 4px' }}>⚠ PONTO DE ATENÇÃO</p>
                      <p style={{ fontSize: 12, color: C.text, margin: 0 }}>{ex.attention}</p>
                    </div>
                    <a href={youtubeSearchUrl(ex.name)} target="_blank" rel="noopener noreferrer" style={{ display: 'block', textAlign: 'center', background: C.emeraldDim, color: C.text, borderRadius: 8, padding: '8px', fontSize: 12, fontWeight: 700, textDecoration: 'none' }}>
                      ▶ Ver execução no YouTube
                    </a>
                  </div>
                )}
              </div>
            ))}
            <p style={{ fontSize: 10, color: C.dim, textAlign: 'center', marginTop: 8 }}>
              Manda um vídeo do seu treino pra DONA no chat pra ela te dar dicas específicas.
            </p>
          </div>
        )}
      </div>

      <div style={{ display: 'flex', borderTop: `1px solid ${C.border}` }}>
        {[['home','Painel'], ['chat','DONA'], ['galeria','Galeria'], ['perfil','Perfil']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} style={{ flex: 1, background: 'none', border: 'none', padding: '12px 0', color: tab === id ? C.emerald : C.dim, fontSize: 10, fontWeight: 700 }}>{label}</button>
        ))}
      </div>
    </Phone>
  );
}

const inputStyle = { background: '#0F172A', border: '1px solid #1E293B', borderRadius: 12, padding: '12px 16px', color: '#F8FAFC', fontSize: 14, flex: 1, minWidth: 0, outline: 'none' };

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
<script>
  const src = document.getElementById('app-src').textContent;
  const output = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  const s = document.createElement('script');
  s.textContent = output;
  document.body.appendChild(s);
